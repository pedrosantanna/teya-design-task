<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <script>
      // The folder this page is served from ("" at the root, "/docs/prototype" under a sub-path). Builds made
      // with `npm run export:web` resolve their scripts, assets and routes against it (scripts/relative-web.mjs).
      (function () {
        var path = location.pathname;
        if (/\/index\.html$/.test(path)) {
          path = path.replace(/index\.html$/, '');
          try { history.replaceState(history.state, '', path + location.search + location.hash); } catch (e) {}
        }
        window.__SNUFFLE_BASE__ = path.replace(/\/[^/]*$/, '');
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- The docs canvas background (site/canvas.css), shown around the phone frame. It follows the app's scheme
         (`data-scheme`, set by src/store/theme-sync.ts), and the device's until the app has started. -->
    <style id="frame-page">
      body {
        margin: 0;
        background-color: #f7f7f8;
        background-image: radial-gradient(circle, #d4d4d8 1px, transparent 1.3px);
        background-size: 24px 24px;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-scheme]) body {
          background-color: #0d0d10;
          background-image: radial-gradient(circle, #2c2c31 1px, transparent 1.3px);
        }
      }
      html[data-scheme="dark"] body {
        background-color: #0d0d10;
        background-image: radial-gradient(circle, #2c2c31 1px, transparent 1.3px);
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
