<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <script>
      // The folder this page is served from ("" at the root, "/docs/prototype" under a sub-path). Builds made
      // with `npm run export:web` resolve their scripts, assets and routes against it (scripts/relative-web.mjs).
      (function () {
        var path = location.pathname;
        if (/\/index\.html$/.test(path)) {
          path = path.replace(/index\.html$/, '');
          try { history.replaceState(history.state, '', path + location.search + location.hash); } catch (e) {}
        }
        window.__SNUFFLE_BASE__ = path.replace(/\/[^/]*$/, '');
        // The icon's relative href would resolve against each route the router pushes (/shops/favicon.ico, 404).
        document.addEventListener('DOMContentLoaded', function () {
          var icon = document.querySelector('link[rel="icon"]');
          if (icon) icon.setAttribute('href', window.__SNUFFLE_BASE__ + '/favicon.ico');
        });
      })();
    </script>
    <script>
      // Route code is split: the first visit to a screen fetched its chunk while the transition waited, so a push
      // started 300-400 ms late. Once the app has painted, the chunks load in the background (the entry bundle
      // lists them) and the first visit costs the same as the second.
      window.addEventListener('load', function () {
        var idle = window.requestIdleCallback || function (cb) { return setTimeout(cb, 600); };
        // Resolved now, from the page's folder: after the router has pushed /shops/x, a relative src would resolve
        // against that route and ask for /shops/_expo/... (404).
        var entry = document.querySelector('script[src*="/index-"]');
        var entrySrc = entry && (window.__SNUFFLE_BASE__ || '') + '/' + entry.getAttribute('src').replace(/^\.\//, '');
        idle(function () {
          if (!entrySrc) return;
          fetch(entrySrc).then(function (r) { return r.text(); }).then(function (code) {
            var seen = {};
            (code.match(/static\/js\/web\/[^"']+?\.js/g) || []).forEach(function (path) {
              if (seen[path]) return;
              seen[path] = true;
              var link = document.createElement('link');
              link.rel = 'prefetch';
              link.as = 'script';
              link.href = (window.__SNUFFLE_BASE__ || '') + '/_expo/' + path;
              document.head.appendChild(link);
            });
          }).catch(function () {});
        }, { timeout: 2000 });
      });
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Touch feel (the native app's): no 300 ms tap delay or double-tap zoom, no long-press callout, no tap
         highlight, no text selection on controls, scrolling that stops at its edge instead of chaining to the
         page, and momentum scrolling. Text inputs keep selection. -->
    <style id="touch-feel">
      html, body {
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      body {
        touch-action: manipulation;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      input, textarea, [contenteditable], [contenteditable] * {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }
      [role="button"], button, a, [tabindex], img {
        touch-action: manipulation;
        -webkit-user-drag: none;
        -webkit-touch-callout: none;
      }
      img { user-drag: none; }
      /* Scroll containers (react-native-web writes their overflow as atomic classes): contained overscroll and
         momentum on touch. */
      #root div { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
      /* Animated layers hint the compositor (press, arrive, sheets). */
      [style*="will-change"] { backface-visibility: hidden; }
    </style>
    <!-- The docs canvas background (site/canvas.css), shown around the phone frame. It follows the app's scheme
         (`data-scheme`, set by src/store/theme-sync.ts), and the device's until the app has started. -->
    <style id="frame-page">
      body {
        margin: 0;
        background-color: #f7f7f8;
        background-image: radial-gradient(circle, #d4d4d8 1px, transparent 1.3px);
        background-size: 24px 24px;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-scheme]) body {
          background-color: #0d0d10;
          background-image: radial-gradient(circle, #2c2c31 1px, transparent 1.3px);
        }
      }
      html[data-scheme="dark"] body {
        background-color: #0d0d10;
        background-image: radial-gradient(circle, #2c2c31 1px, transparent 1.3px);
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
