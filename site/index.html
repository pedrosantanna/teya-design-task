<title>High Street Docs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* Docs shell in the shadcn/ui idiom: neutral zinc tokens, hierarchy from weight and space, borders only where they separate. */
:root {
  --bg: #ffffff;
  --bg-subtle: #fafafa;
  --fg: #09090b;
  --fg-2: #3f3f46;
  --muted: #f4f4f5;
  --muted-fg: #71717a;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --primary: #18181b;
  --primary-fg: #fafafa;
  --ring: #a1a1aa;
  --link: #18181b;
  --quote-bar: #d4d4d8;
  --c1: #3866c9; --c2: #c07a1e; --c3: #2a8a64; --c4: #8556c2; --c5: #c8473a;
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 8px;
  --header-h: 56px;
  --sidebar-w: 260px;
  --toc-w: 208px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090b; --bg-subtle: #111113; --fg: #fafafa; --fg-2: #d4d4d8; --muted: #18181b; --muted-fg: #a1a1aa;
    --border: #27272a; --border-strong: #3f3f46; --primary: #fafafa; --primary-fg: #18181b; --ring: #52525b; --link: #fafafa; --quote-bar: #3f3f46;
    --c1: #7ea4ee; --c2: #e0a35a; --c3: #5cbf95; --c4: #b495e6; --c5: #e98272;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090b; --bg-subtle: #111113; --fg: #fafafa; --fg-2: #d4d4d8; --muted: #18181b; --muted-fg: #a1a1aa;
  --border: #27272a; --border-strong: #3f3f46; --primary: #fafafa; --primary-fg: #18181b; --ring: #52525b; --link: #fafafa; --quote-bar: #3f3f46;
  --c1: #7ea4ee; --c2: #e0a35a; --c3: #5cbf95; --c4: #b495e6; --c5: #e98272;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-sans); font-size: 15px; line-height: 1.65;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 4px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  height: var(--header-h); display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.brand-mark {
  width: 24px; height: 24px; border-radius: 6px; background: var(--primary); color: var(--primary-fg);
  display: grid; place-items: center; font-weight: 600; font-size: 11px; letter-spacing: .01em; flex: none;
}
.brand-name { font-weight: 600; font-size: 14px; white-space: nowrap; }
.brand-sub { color: var(--muted-fg); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sep { color: var(--border-strong); }
.topbar-spacer { flex: 1; }
.controls { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); }
.seg button { display: inline-grid; place-items: center; height: 26px; min-width: 26px; padding: 0 8px; border: 0; border-radius: 999px; background: transparent; color: var(--muted-fg); font: 500 12px var(--font-sans); letter-spacing: .02em; cursor: pointer; }
.seg button svg { width: 14px; height: 14px; }
.seg.icons button { padding: 0; width: 26px; }
.seg button:hover { color: var(--fg); }
.seg button[aria-checked="true"] { background: var(--muted); color: var(--fg); box-shadow: inset 0 0 0 1px var(--border); }
.lang-note { font-size: 13px; color: var(--muted-fg); border-left: 2px solid var(--border); padding: 2px 0 2px 12px; margin: 0 0 var(--s-5); }
.menu-btn {
  display: none; width: 36px; height: 36px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--fg); cursor: pointer; place-items: center; flex: none;
}

/* Shell */
.shell {
  display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  max-width: 1440px; margin: 0 auto;
}
.sidebar {
  position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px));
  height: calc(100vh - var(--header-h) - env(safe-area-inset-top, 0px));
  overflow-y: auto; border-right: 1px solid var(--border);
  padding: 20px 12px 40px max(16px, env(safe-area-inset-left, 0px));
  background: var(--bg);
}
.search {
  width: 100%; height: 34px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--fg); font: inherit; font-size: 13px; padding: 0 10px; margin-bottom: 20px;
}
.search::placeholder { color: var(--muted-fg); }
.search:hover { border-color: var(--border-strong); }
.nav-group { display: flex; flex-direction: column; gap: 1px; margin-bottom: 24px; }
.nav-group-title {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; font-weight: 600; padding: 0 8px 6px; color: var(--fg);
}
.nav-group.is-disabled .nav-group-title { color: var(--muted-fg); font-weight: 500; }
.badge { font-size: 12px; font-weight: 400; color: var(--muted-fg); }
.nav-link {
  display: block; text-decoration: none; font-size: 13.5px; line-height: 1.4; color: var(--muted-fg);
  padding: 6px 8px; border-radius: 6px;
}
.nav-link:hover { color: var(--fg); }
.nav-link[aria-current="page"] { color: var(--fg); background: var(--muted); font-weight: 500; }
.nav-sub { display: flex; flex-direction: column; gap: 1px; margin: 0 0 4px 12px; padding-left: 6px; border-left: 1px solid var(--border); }
.nav-sub-title { font-size: 13.5px; color: var(--fg-2); padding: 6px 8px 2px; }
.nav-empty { font-size: 13px; color: var(--muted-fg); padding: 2px 8px; line-height: 1.45; }

/* Main */
.main {
  display: grid; grid-template-columns: minmax(0, 1fr) var(--toc-w); gap: 56px;
  padding: 40px max(24px, env(safe-area-inset-right, 0px)) 96px 56px; min-width: 0;
}
.content { min-width: 0; max-width: 840px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted-fg); margin-bottom: 12px; }
.crumbs span[aria-hidden] { opacity: .6; }
.page-title { font-size: 34px; line-height: 1.15; letter-spacing: -.025em; font-weight: 600; margin: 0 0 12px; text-wrap: balance; }
.page-lede { font-size: 18px; line-height: 1.55; color: var(--muted-fg); margin: 0 0 16px; max-width: 62ch; text-wrap: pretty; }
.page-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted-fg); padding-bottom: 28px; border-bottom: 1px solid var(--border); margin-bottom: 32px; font-variant-numeric: tabular-nums; }
.page-meta code { font-family: var(--font-mono); font-size: 12px; }

/* Prose */
.prose > :first-child { margin-top: 0; }
.prose p, .prose li { max-width: 68ch; text-wrap: pretty; }
.prose h2 { font-size: 23px; line-height: 1.3; letter-spacing: -.015em; font-weight: 600; margin: 56px 0 14px; scroll-margin-top: 84px; text-wrap: balance; }
.prose h3 { font-size: 17px; line-height: 1.4; letter-spacing: -.005em; font-weight: 600; margin: 36px 0 10px; scroll-margin-top: 84px; text-wrap: balance; }
.prose h4 { font-size: 15px; font-weight: 600; margin: 24px 0 6px; }
.prose h2 + h3 { margin-top: 20px; }
.prose p { margin: 0 0 16px; }
.prose ul, .prose ol { padding-left: 20px; margin: 0 0 18px; }
.prose li { margin: 6px 0; padding-left: 2px; }
.prose li::marker { color: var(--muted-fg); }
.prose ol li::marker { font-variant-numeric: tabular-nums; }
.prose a { color: var(--link); text-decoration: underline; text-decoration-color: var(--border-strong); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.prose a:hover { text-decoration-color: currentColor; }
.prose a:not([href]) { text-decoration-style: dotted; cursor: help; }
.prose strong { font-weight: 600; }
.prose hr { border: 0; border-top: 1px solid var(--border); margin: 40px 0; }
.prose code { font-family: var(--font-mono); font-size: .85em; background: var(--muted); border-radius: 4px; padding: 1px 5px; }
.prose pre { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; overflow-x: auto; font-size: 13px; line-height: 1.6; }
.prose pre code { background: none; padding: 0; font-size: inherit; }
.prose blockquote { margin: 0 0 18px; padding: 0 0 0 16px; border-left: 2px solid var(--quote-bar); color: var(--fg-2); }
.prose img { max-width: 100%; height: auto; }

/* Tables: no outer box; a firm rule under the header, hairlines between rows. */
.table-wrap { overflow-x: auto; margin: 8px 0 28px; -webkit-overflow-scrolling: touch; }
.prose table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.5; }
.prose th { text-align: left; vertical-align: bottom; font-size: 13px; font-weight: 500; color: var(--muted-fg); padding: 0 16px 8px 0; border-bottom: 1px solid var(--border-strong); }
.prose td { padding: 11px 16px 11px 0; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.prose th:last-child, .prose td:last-child { padding-right: 0; }
.prose td:first-child { color: var(--fg); font-weight: 500; }
.prose td strong { color: var(--fg); }
.prose th.num, .prose td.num { text-align: right; white-space: nowrap; }
.prose td.num { font-weight: 400; }
.prose th.sym, .prose td.sym { text-align: center; width: 1%; white-space: nowrap; padding-left: 8px; padding-right: 8px; color: var(--fg); }
.prose table.is-wide th.num, .prose table.is-wide td.num { min-width: 0; width: 1%; }
/* Many columns: give each room and keep the row label in view while scrolling sideways. */
.prose table.is-wide { min-width: 880px; font-size: 13.5px; }
.prose table.is-wide th, .prose table.is-wide td { min-width: 8.5rem; }
.prose table.is-wide th:first-child, .prose table.is-wide td:first-child { position: sticky; left: 0; z-index: 1; background: var(--bg); min-width: 9.5rem; box-shadow: inset -1px 0 0 var(--border); padding-left: 0; }
.prose table.is-wide th:first-child + *, .prose table.is-wide td:first-child + * { padding-left: 14px; }
/* Two-column key/value tables written with an empty header row. */
.prose table.kv thead { display: none; }
.prose table.kv { border-top: 1px solid var(--border); }
.prose table.kv td:first-child { width: 11rem; font-weight: 500; color: var(--fg); font-size: 13.5px; }
.prose table.kv td { padding-top: 10px; padding-bottom: 10px; }

/* Evidence: quote cards */
.quote-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px 16px; margin: 0 0 12px; background: var(--bg); display: flex; flex-direction: column; }
.quote-card .quote-text { font-size: 15.5px; line-height: 1.55; margin: 0 0 14px; padding: 0; border: 0; color: var(--fg); text-indent: -.4em; text-wrap: pretty; }
.quote-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 12.5px; color: var(--muted-fg); font-variant-numeric: tabular-nums; margin-top: auto; }
.quote-meta .who { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 0 8px; margin-bottom: 2px; }
.quote-meta .handle { color: var(--fg); font-weight: 500; overflow-wrap: anywhere; }
.quote-meta a { color: var(--muted-fg); text-decoration: none; margin-left: auto; white-space: nowrap; }
.quote-meta a:hover { color: var(--fg); }
.status { display: inline-flex; align-items: center; gap: 5px; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-verified { color: var(--fg-2); }
.status-archive { color: var(--muted-fg); }
.status-archive::before { background: transparent; box-shadow: inset 0 0 0 1px currentColor; }
.quote-card .quote-context { font-size: 13px; line-height: 1.5; color: var(--muted-fg); margin: 6px 0 0; max-width: none; }
.tags { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.tag { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted-fg); }
.quote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; margin: 8px 0 24px; }
.quote-grid .quote-card { margin: 0; }

/* Empathy map (Strategyzer canvas order): six equal cells, hairline gutters. */
.empathy { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin: 12px 0 28px; }
.empathy-cell { padding: 18px 20px 16px; background: var(--bg); min-width: 0; }
.empathy-cell.pains, .empathy-cell.gains { background: var(--bg-subtle); }
.empathy-label { font-size: 14px; font-weight: 600; color: var(--fg); margin: 0 0 8px; }
.empathy-cell ul { margin: 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.55; color: var(--fg-2); }
.empathy-cell li { position: relative; margin: 0; padding: 0 0 0 14px; max-width: none; }
.empathy-cell li + li { margin-top: 8px; }
.empathy-cell li::before { content: ""; position: absolute; left: 0; top: .68em; width: 5px; height: 1px; background: var(--muted-fg); }

/* Timeline */
.timeline { list-style: none; padding: 0; margin: 8px 0 28px; }
.timeline li { position: relative; display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 0 20px; padding: 0 0 16px; margin: 0; max-width: none; }
.timeline li::before { content: ""; position: absolute; left: calc(7.5rem + 9px); top: 0; bottom: 0; width: 1px; background: var(--border); }
.timeline li::after { content: ""; position: absolute; left: calc(7.5rem + 6px); top: .55em; width: 7px; height: 7px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--muted-fg); }
.timeline li:first-child::before { top: .8em; }
.timeline li:last-child::before { bottom: auto; height: .8em; }
.timeline li > :not(time) { grid-column: 2; }
.timeline time { grid-column: 1; text-align: right; font-size: 13px; color: var(--muted-fg); font-variant-numeric: tabular-nums; padding-top: 1px; white-space: nowrap; }
.timeline li { color: var(--fg-2); }
.timeline .tl-text { padding-left: 14px; }

/* Page summary: label column + bullets, ruled, no box. */
.summary { margin: 0 0 40px; border-bottom: 1px solid var(--border); }
.prose > .summary:first-child section:first-child { padding-top: 0; }
.summary section { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 4px 24px; padding: 16px 0; border-top: 1px solid var(--border); min-width: 0; }
.summary section:first-child { border-top: 0; }
.summary h5 { margin: 0; font-size: 13px; line-height: 1.6; font-weight: 600; color: var(--fg); padding-top: 1px; }
.summary ul { margin: 0; padding: 0; list-style: none; font-size: 14.5px; line-height: 1.6; color: var(--fg-2); }
.summary li { position: relative; margin: 0; padding-left: 16px; max-width: 70ch; }
.summary li + li { margin-top: 6px; }
.summary li::before { content: ""; position: absolute; left: 0; top: .78em; width: 6px; height: 1px; background: var(--muted-fg); }
.summary .takeaways ul { color: var(--fg); font-size: 15px; }
.summary .ai h5, .summary .tradeoffs h5 { color: var(--muted-fg); font-weight: 500; }
@media (max-width: 640px) { .summary section { grid-template-columns: minmax(0, 1fr); } }

/* Persona header: portrait, tagline, attributes in columns. */
.persona { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 0 24px; align-items: start; margin: 12px 0 24px; }
.persona figure { margin: 0; }
.persona img { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; display: block; background: var(--muted); box-shadow: inset 0 0 0 1px var(--border); }
.persona-name { font-size: 17px; font-weight: 600; margin: 0 0 2px !important; }
.persona .ptag { display: block; font-size: 18px; line-height: 1.45; letter-spacing: -.01em; color: var(--fg); margin: 2px 0 16px; max-width: 46ch; text-wrap: pretty; }
.persona dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: 12px 24px; margin: 0; padding-top: 14px; border-top: 1px solid var(--border); }
.persona dl > div { min-width: 0; }
.persona dt { font-size: 12.5px; color: var(--muted-fg); margin-bottom: 2px; }
.persona dd { margin: 0; font-size: 14px; line-height: 1.45; color: var(--fg); }
.persona .src { display: block; margin-top: 3px; font-size: 12px; color: var(--muted-fg); }
.persona .src.assumed { font-style: italic; }
.persona .credit { display: block; font-size: 12px; color: var(--muted-fg); margin-top: 14px; }
.persona .credit a { color: inherit; text-underline-offset: 2px; text-decoration-color: var(--border-strong); }
@media (max-width: 560px) {
  .persona { grid-template-columns: 64px minmax(0, 1fr); gap: 0 16px; }
  .persona img { width: 64px; height: 64px; }
  .persona .ptag { font-size: 16px; }
  .persona dl { grid-column: 1 / -1; margin-top: 4px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .persona .credit { grid-column: 1 / -1; }
}

/* Cluster map: need x where it broke */
.cmap { margin: 12px 0 28px; padding: 0; }
.cmap-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.cmap svg { display: block; width: 100%; min-width: 560px; height: auto; }
.cmap .gl { stroke: var(--border); }
.cmap .base { stroke: var(--border-strong); }
.cmap .tk { fill: var(--muted-fg); font: 400 11.5px var(--font-sans); }
.cmap .ax { fill: var(--muted-fg); font: 500 11.5px var(--font-sans); }
.cmap .zone { fill-opacity: .08; stroke-opacity: .45; }
.cmap .pt { stroke-width: 2; }
.cmap .pt.defects { fill: var(--bg) !important; }
.cmap .pt.unknown { fill-opacity: .4; stroke-opacity: .55; }
.cmap .cl { fill: var(--fg); font: 600 13px var(--font-sans); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.cmap .cn { fill: var(--muted-fg); font: 400 12px var(--font-sans); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.cmap figcaption { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.cmap-foot { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--fg-2); }
.cmap-foot span { display: inline-flex; align-items: center; gap: 7px; }
.cmap-foot .sep { flex-basis: 100%; height: 0; }
.cmap-foot .enc { color: var(--muted-fg); }
.cmap-note { font-size: 13px; color: var(--muted-fg); margin: 8px 0 0; }

/* Occasion grid (job x where it broke) */
.ogrid-wrap { overflow-x: auto; margin: 12px 0 8px; }
.ogrid { border-collapse: collapse; width: 100%; min-width: 600px; font-size: 13.5px; }
.ogrid th, .ogrid td { border-bottom: 1px solid var(--border); padding: 12px 14px 12px 0; vertical-align: top; text-align: left; }
.ogrid thead th { font-weight: 500; vertical-align: bottom; padding-bottom: 8px; border-bottom-color: var(--border-strong); }
.ogrid thead th small { display: block; font-size: 12px; font-weight: 400; color: var(--muted-fg); }
.ogrid tbody th { font-weight: 500; width: 160px; color: var(--fg); }
.ogrid td { border-left: 1px solid var(--border); padding-left: 14px; }
.ogrid thead th + th { padding-left: 14px; }
.ogrid .n { font-size: 13px; font-weight: 500; color: var(--fg); display: block; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.ogrid .marks { display: flex; flex-wrap: wrap; gap: 4px; }
i.m { width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; background: currentColor; display: inline-block; flex: none; }
i.m.defects { background: transparent; }
i.m.unknown { opacity: .45; }
.ogrid td.empty { background: transparent; }
.ogrid-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--fg-2); margin: 12px 0 28px; }
.ogrid-legend span { display: inline-flex; align-items: center; gap: 7px; }
.ogrid-legend .sep { flex-basis: 100%; height: 0; }
.ogrid-legend .enc { color: var(--muted-fg); }

/* Prev / next */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 72px; }
.pager a { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; text-decoration: none; min-width: 0; transition: border-color .15s; }
.pager a:hover { border-color: var(--border-strong); background: var(--bg-subtle); }
.pager .dir { font-size: 13px; color: var(--muted-fg); }
.pager .ttl { font-weight: 500; font-size: 15px; }
.pager .next { text-align: right; grid-column: 2; }

/* On this page */
.toc { position: sticky; top: calc(var(--header-h) + 40px); align-self: start; max-height: calc(100vh - var(--header-h) - 80px); overflow-y: auto; font-size: 13px; }
.toc-title { font-weight: 600; margin: 0 0 10px; font-size: 13px; }
.toc ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 1px; }
.toc a { display: block; text-decoration: none; color: var(--muted-fg); padding: 4px 0; line-height: 1.4; text-wrap: pretty; }
.toc a:hover { color: var(--fg); }
.toc a.is-active { color: var(--fg); font-weight: 500; }
.toc .lvl-3 a { padding-left: 12px; }

.state { color: var(--muted-fg); font-size: 14px; padding: 24px 0; }
.skeleton { height: 14px; border-radius: 4px; background: var(--muted); margin: 10px 0; }

/* Responsive */
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr); padding-left: 48px; padding-right: 48px; }
  .toc { display: none; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: grid; }
  .brand-sub, .brand-sep { display: none; }
  .sidebar {
    position: fixed; z-index: 30; left: 0; top: calc(var(--header-h) + env(safe-area-inset-top, 0px)); bottom: 0;
    height: auto; width: min(300px, 86vw); transform: translateX(-102%); transition: transform .2s ease;
    padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 10px 30px rgba(0,0,0,.12);
  }
  body.nav-open .sidebar { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.35); }
  .main { padding: 28px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
  .page-title { font-size: 28px; }
  .page-lede { font-size: 16.5px; }
  .prose h2 { font-size: 21px; margin-top: 44px; }
  .empathy { grid-template-columns: minmax(0, 1fr); }
  .pager { grid-template-columns: minmax(0, 1fr); margin-top: 56px; }
  .pager .next { grid-column: 1; }
}
@media (max-width: 560px) {
  .timeline li { grid-template-columns: minmax(0, 1fr); padding-left: 20px; }
  .timeline li::before { left: 3px; }
  .timeline li::after { left: 0; }
  .timeline time, .timeline li > :not(time) { grid-column: 1; text-align: left; }
  .timeline .tl-text { padding-left: 0; }
  .prose table.kv td:first-child { width: 7.5rem; }
  .prose table.is-wide th:first-child, .prose table.is-wide td:first-child { min-width: 7.5rem; }
  .quote-card { padding: 16px; }
  .ogrid tbody th { width: 120px; }
}
@media (prefers-reduced-motion: reduce) { .sidebar, .pager a { transition: none; } html { scroll-behavior: auto; } }

/* Vertical rhythm — one scale for the whole page.
   Proximity follows gestalt: a heading sits close to what it introduces and far from what came before;
   items inside a block are tight; blocks in a section are medium; sections are far apart. */
:root { --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 40px; --s-7: 64px; }
.prose.prose > * { margin-top: 0; margin-bottom: 0; }
.prose.prose > * + * { margin-top: var(--s-5); }          /* block to block within a section */
.prose.prose > p + p,
.prose.prose > p + ul, .prose.prose > p + ol,
.prose.prose > ul + p, .prose.prose > ol + p { margin-top: var(--s-4); }   /* running text */
.prose.prose > h2 { margin-top: var(--s-7); }              /* new section */
.prose.prose > h3 { margin-top: var(--s-6); }              /* new subsection */
.prose.prose > h4 { margin-top: var(--s-5); }
.prose.prose > h2 + *, .prose.prose > h2 + h3 { margin-top: var(--s-3); }   /* heading hugs its content */
.prose.prose > h3 + *, .prose.prose > h4 + * { margin-top: var(--s-2); }
.prose.prose > :first-child { margin-top: 0; }
.prose h4 { font-size: 13px; font-weight: 600; letter-spacing: .01em; color: var(--muted-fg); }
.summary { margin-bottom: var(--s-6) !important; }
.prose table.fit { width: auto; min-width: min(100%, 24rem); }

<script>
(() => {
  // Served from the repo root in dev (site/serve.py) and from the artifact root when published,
  // so every content path is the repo-relative path, e.g. docs/discover/index.md.
  const $ = (s, el = document) => el.querySelector(s);
  const els = { nav: $('#nav'), content: $('#content'), toc: $('#toc'), search: $('#search'), sidebar: $('#sidebar'), scrim: $('#scrim'), menu: $('#menu-btn') };

  // --- Language and theme (per-viewer, remembered when storage is available) ----
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  let LANG = store.get('hs-lang') === 'pt' ? 'pt' : 'en';
  const UI = {
    en: { filter: 'Filter pages', noMatch: 'No pages match', soon: 'Soon', onPage: 'On this page', prev: '← Previous', next: 'Next →',
      takeaways: 'Key takeaways', call: 'My call', ai: 'AI in this step', tradeoffs: 'Trade-offs', verified: 'Verified', archive: 'Via archive',
      verifiedTip: 'Checked against the live source', archiveTip: 'Collected from a public archive; not yet checked against the live source', source: 'Source ↗',
      photoFor: 'Photo standing in for', kept: 'kept going', gaveUp: 'gave up on local', notShown: 'not shown',
      mapNote: n => `Each dot is one post; posts with the same codes sit side by side. Not on the chart: ${n} posts where nothing broke.`,
      persists: 'persists', defects: 'defects', unknown: 'stance unknown', urgent: 'urgent', notPublished: 'Not published yet',
      loadFail: (src, m) => `Couldn’t load <code>${src}</code> (${m}). Check that the file exists in the repo and is published with the page.`,
      notTranslated: 'This page isn’t translated yet, so it shows in English.' },
    pt: { filter: 'Filtrar páginas', noMatch: 'Nenhuma página com', soon: 'Em breve', onPage: 'Nesta página', prev: '← Anterior', next: 'Próxima →',
      takeaways: 'Principais pontos', call: 'Minha decisão', ai: 'IA nesta etapa', tradeoffs: 'Trade-offs', verified: 'Verificada', archive: 'Via arquivo',
      verifiedTip: 'Conferida na fonte original', archiveTip: 'Coletada de um arquivo público; ainda não conferida na fonte original', source: 'Fonte ↗',
      photoFor: 'Foto que representa', kept: 'continuou', gaveUp: 'desistiu do comércio local', notShown: 'não aparece',
      mapNote: n => `Cada ponto é um post; posts com as mesmas etiquetas ficam lado a lado. Fora do gráfico: ${n} posts em que nada deu errado.`,
      persists: 'continuou', defects: 'desistiu', unknown: 'não aparece', urgent: 'urgente', notPublished: 'Ainda não publicada',
      loadFail: (src, m) => `Não foi possível carregar <code>${src}</code> (${m}).`,
      notTranslated: 'Esta página ainda não foi traduzida, por isso aparece em inglês.' }
  };
  const t = k => (UI[LANG][k] !== undefined ? UI[LANG][k] : UI.en[k]);
  // Labels that come from generated data (chart JSON) and are written in English.
  const PT_STR = {
    'Need urgency': 'Urgência da necessidade', 'Purchase stage': 'Etapa da compra', 'Browsing': 'Passeando', 'Needs it now': 'Precisa agora',
    'Find out · findability': 'Saber · findability', 'Get it · transaction': 'Levar · transaction',
    'Discovery': 'Descoberta', 'Routine': 'Rotina', 'Specific item': 'Item específico', 'Specific + deadline': 'Específico + prazo',
    '1 · Find out': '1 · Saber', '2 · Find it': '2 · Encontrar', '3 · Accept it': '3 · Aceitar', '4 · Get it': '4 · Levar',
    'Sam, the mission shopper': 'Sam, o comprador em missão', 'Jess, the lapsed local': 'Jess, a local que desistiu', 'Ruth, the regular': 'Ruth, a frequentadora',
    'Nothing broke (not clustered)': 'Nada deu errado (fora dos clusters)',
    'Specific item or shop': 'Item ou loja específica', 'Routine shopping and services': 'Compras de rotina e serviços', 'Discovery and browsing': 'Descoberta e passeio',
    'No failure': 'Sem falha',
    'findability': 'findability', 'transaction': 'transaction', "the street's offer": 'a oferta da rua'
  };
  const tr = s => (LANG === 'pt' && PT_STR[s]) ? PT_STR[s] : s;
  const L = o => (o && LANG === 'pt' && o.pt) ? o.pt : (o ? o.title : '');
  const srcFor = src => LANG === 'pt' ? src.replace(/^docs\//, 'docs/pt-br/') : src;
  const canon = src => src.replace(/^docs\/pt-br\//, 'docs/');
  const EMPATHY_CLASS = { 'vê': 'see', 'ouve': 'hear', 'pensa-e-sente': 'think-and-feel', 'diz-e-faz': 'say-and-do', 'dores': 'pains', 'ganhos': 'gains' };

  let MODE = ['light', 'dark'].includes(store.get('hs-theme')) ? store.get('hs-theme') : 'system';
  function applyMode() {
    if (MODE === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', MODE);
    document.querySelectorAll('#theme-seg button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.mode === MODE)));
  }
  function applyLangUI() {
    document.documentElement.lang = LANG === 'pt' ? 'pt-BR' : 'en';
    document.querySelectorAll('#lang-seg button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.lang === LANG)));
    els.search.placeholder = t('filter'); els.search.setAttribute('aria-label', t('filter'));
  }
  applyMode();
  const cache = new Map();
  let NAV = null, PAGES = [], BY_SRC = new Map(), tocObserver = null;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = s => s.toLowerCase().replace(/<[^>]+>/g, '').replace(/&[a-z]+;/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const inline = s => marked.parseInline(s || '');

  // --- Custom fenced blocks -------------------------------------------------
  // ```quote      text/handle/network/date/url/tags/context, one "key: value" per line
  // ```empathy-map  "Label:" lines followed by "- bullet" lines
  // ```timeline   "- YYYY-MM-DD — text" lines
  function kv(src) {
    const o = {};
    src.split('\n').forEach(line => {
      const i = line.indexOf(':');
      if (i > 0) o[line.slice(0, i).trim().toLowerCase()] = line.slice(i + 1).trim();
    });
    return o;
  }
  function quoteCard(src) {
    const q = kv(src);
    const text = (q.text || '').replace(/^["“]|["”]$/g, '');
    const tags = (q.tags || '').split(',').map(t => t.trim()).filter(Boolean);
    return `<figure class="quote-card"><blockquote class="quote-text">“${inline(esc(text))}”</blockquote>
      <figcaption class="quote-meta"><span class="who"><span class="handle">${esc(q.handle || 'unknown')}</span>${q.network ? `<span class="net">${esc(q.network)}</span>` : ''}</span>${q.date ? `<time datetime="${esc(q.date)}">${esc(q.date)}</time>` : ''}${q.status ? `<span class="status status-${esc(q.status)}" title="${q.status === 'verified' ? t('verifiedTip') : t('archiveTip')}">${q.status === 'verified' ? t('verified') : t('archive')}</span>` : ''}${q.url ? `<a href="${esc(q.url)}" target="_blank" rel="noopener">${t('source')}</a>` : ''}</figcaption>
      ${q.context ? `<p class="quote-context">${inline(esc(q.context))}</p>` : ''}
      ${tags.length ? `<div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}</figure>`;
  }
  function empathyMap(src) {
    const cells = []; let cur = null;
    src.split('\n').forEach(line => {
      const t = line.trim(); if (!t) return;
      if (t.startsWith('- ')) { if (cur) cur.items.push(t.slice(2)); }
      else if (t.endsWith(':')) { cur = { label: t.slice(0, -1), items: [] }; cells.push(cur); }
    });
    return `<div class="empathy">${cells.map(c => {
      const k = EMPATHY_CLASS[slug(c.label)] || slug(c.label);
      return `<section class="empathy-cell ${k}"><p class="empathy-label">${esc(c.label)}</p><ul>${c.items.map(i => `<li>${inline(i)}</li>`).join('')}</ul></section>`;
    }).join('')}</div>`;
  }
  function timeline(src) {
    const items = src.split('\n').map(l => l.trim()).filter(l => l.startsWith('- ')).map(l => {
      const m = l.slice(2).match(/^(\d{4}-\d{2}(?:-\d{2})?)\s*[—–-]\s*(.*)$/);
      return m ? `<li><time datetime="${m[1]}">${m[1]}</time><span class="tl-text">${inline(m[2])}</span></li>` : `<li><span class="tl-text">${inline(l.slice(2))}</span></li>`;
    });
    return `<ol class="timeline">${items.join('')}</ol>`;
  }
  // ```summary  "Takeaways:", "Call:", "AI:" and "Trade-offs:" headings, each followed by "- " bullets. Sits at the top of a page.
  function summary(src) {
    const parts = {}; let cur = null;
    src.split('\n').forEach(line => {
      const t = line.trim(); if (!t) return;
      if (t.startsWith('- ')) { if (cur) parts[cur].push(t.slice(2)); }
      else if (t.endsWith(':')) { cur = t.slice(0, -1).toLowerCase(); parts[cur] = []; }
    });
    const sec = (key, title) => parts[key] ? `<section class="${key.replace(/[^a-z]/g, '')}"><h5>${title}</h5><ul>${parts[key].map(i => `<li>${inline(i)}</li>`).join('')}</ul></section>` : '';
    return `<div class="summary">${sec('takeaways', t('takeaways'))}${sec('call', t('call'))}${sec('ai', t('ai'))}${sec('trade-offs', t('tradeoffs'))}</div>`;
  }

  // ```persona  key: value lines (name, tagline, image, credit, credit_url) and "- Label: value | evidence|assumed" attributes.
  function persona(src) {
    const q = {}, attrs = [];
    src.split('\n').forEach(line => {
      const t = line.trim(); if (!t) return;
      if (t.startsWith('- ')) {
        const [body, kind = ''] = t.slice(2).split('|').map(x => x.trim());
        const i = body.indexOf(':');
        attrs.push({ k: body.slice(0, i).trim(), v: body.slice(i + 1).trim(), kind: kind.toLowerCase() });
      } else { const i = t.indexOf(':'); if (i > 0) q[t.slice(0, i).trim()] = t.slice(i + 1).trim(); }
    });
    const img = q.image ? `<figure><img data-src="${esc(q.image)}" alt="${t('photoFor')} ${esc(q.name || '')}"></figure>` : '<span></span>';
    const credit = q.credit ? `<span class="credit">${q.credit_url ? `<a href="${esc(q.credit_url)}" target="_blank" rel="noopener">${esc(q.credit)}</a>` : esc(q.credit)}</span>` : '';
    const kind = k => k === 'evidence' ? 'From the posts' : k === 'assumed' ? 'Assumed' : esc(k);
    const dl = attrs.length ? `<dl>${attrs.map(a => `<div><dt>${esc(a.k)}</dt><dd>${inline(a.v)}${a.kind ? `<span class="src ${esc(a.kind)}">${kind(a.kind)}</span>` : ''}</dd></div>`).join('')}</dl>` : '';
    return `<div class="persona" data-name="${esc(q.name || '')}">${img}<div class="persona-body">${q.name ? `<p class="persona-name">${esc(q.name)}</p>` : ''}<span class="ptag">${inline(q.tagline || '')}</span>${dl}${credit}</div></div>`;
  }

  // ```cluster-map  JSON from scripts/build_personas.py: posts on need x where it broke, k-means clusters.
  function clusterMap(src) {
    let d;
    try { d = JSON.parse(src); } catch (e) { return `<pre><code>${esc(src)}</code></pre>`; }
    const W = 680, H = 452, Lm = 128, R = 24, T = 36, B = 52;
    const sx = v => Lm + (v / 10.5) * (W - Lm - R), sy = v => T + (1 - (v + 0.8) / 11.6) * (H - T - B);
    const ids = Object.keys(d.names);
    const col = c => `var(--c${ids.indexOf(c) + 1})`;
    // Posts with the same codes share a coordinate; lay them out in a small grid around it.
    const groups = {};
    d.points.forEach(p => (groups[`${p.x},${p.y}`] = groups[`${p.x},${p.y}`] || []).push(p));
    const placed = [];
    Object.values(groups).forEach(list => list.forEach((p, i) => {
      const per = Math.ceil(Math.sqrt(list.length)), r = Math.floor(i / per), c = i % per;
      const off = 13, w = (Math.min(per, list.length) - 1) * off, h = (Math.ceil(list.length / per) - 1) * off;
      placed.push({ ...p, cx: sx(p.x) - w / 2 + c * off, cy: sy(p.y) - h / 2 + r * off });
    }));
    let g = '';
    d.x.ticks.forEach(([v, lab]) => g += `<line class="gl" x1="${sx(v)}" x2="${sx(v)}" y1="${sy(10.8)}" y2="${sy(-0.8)}"/><text class="tk" x="${sx(v)}" y="${sy(-0.8) + 18}" text-anchor="middle">${esc(tr(lab))}</text>`);
    d.y.ticks.forEach(([v, lab]) => g += `<line class="gl" x1="${sx(0)}" x2="${sx(10.5)}" y1="${sy(v)}" y2="${sy(v)}"/><text class="tk" x="${Lm - 10}" y="${sy(v) + 4}" text-anchor="end">${esc(tr(lab))}</text>`);
    g += `<line class="base" x1="${sx(0)}" x2="${sx(10.5)}" y1="${sy(-0.8)}" y2="${sy(-0.8)}"/><line class="base" x1="${sx(0)}" x2="${sx(0)}" y1="${sy(10.8)}" y2="${sy(-0.8)}"/>`;
    g += `<text class="ax" x="${sx(0)}" y="${H - 6}">← ${esc(tr(d.x.min))}</text><text class="ax" x="${sx(10.5)}" y="${H - 6}" text-anchor="end">${esc(tr(d.x.max))} →</text>`;
    g += `<text class="ax" x="8" y="${T - 14}">↑ ${esc(tr(d.y.max))}</text><text class="ax" x="8" y="${sy(-0.8) + 18}">↓ ${esc(tr(d.y.min))}</text>`;
    // A soft zone around each cluster: the box around its points, padded.
    ids.forEach(c => {
      const mine = placed.filter(p => p.c === c); if (!mine.length) return;
      const xs = mine.map(p => p.cx), ys = mine.map(p => p.cy), pad = 16;
      const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
      g += `<rect class="zone" x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" rx="14" fill="${col(c)}" stroke="${col(c)}"/>`;
    });
    g += placed.map(p => `<circle class="pt ${p.s}" cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="5" fill="${col(p.c)}" stroke="${col(p.c)}"><title>${esc(p.h)} · ${esc(tr(d.names[p.c]))} · ${p.s}</title></circle>`).join('');
    ids.forEach(c => {
      const mine = placed.filter(p => p.c === c); if (!mine.length) return;
      const top = Math.min(...mine.map(p => p.cy)) - 24, mid = mine.reduce((a, p) => a + p.cx, 0) / mine.length;
      const name = tr(d.names[c]).split(',')[0], n = d.centres[c].n;
      g += `<text class="cl" x="${mid}" y="${top}" text-anchor="middle">${esc(name)} <tspan class="cn">(${n})</tspan></text>`;
    });
    const legend = ids.map(c => `<span><i class="m" style="color:${col(c)}"></i>${esc(tr(d.names[c]))}</span>`).join('') +
      `<span class="sep"></span><span class="enc"><i class="m" style="color:var(--muted-fg)"></i>${t('kept')}</span><span class="enc"><i class="m defects" style="color:var(--muted-fg)"></i>${t('gaveUp')}</span><span class="enc"><i class="m unknown" style="color:var(--muted-fg)"></i>${t('notShown')}</span>`;
    return `<figure class="cmap"><div class="cmap-scroll"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Posts by need and by where the occasion broke, grouped into clusters">${g}</svg></div>
      <figcaption><div class="cmap-foot">${legend}</div><p class="cmap-note">${t('mapNote')(d.worked.length)}</p></figcaption></figure>`;
  }

  // ```occasion-grid  JSON from scripts/build_personas.py: jobs x where the occasion broke, one mark per post.
  function occasionGrid(src) {
    let d;
    try { d = JSON.parse(src); } catch (e) { return `<pre><code>${esc(src)}</code></pre>`; }
    const gids = Object.keys(d.groups);
    const col = g => g === 'worked' ? 'var(--muted-fg)' : `var(--c${gids.indexOf(g) + 1})`;
    const cell = (r, c) => d.cells.find(x => x.row === r && x.col === c);
    const head = `<tr><th></th>${d.cols.map(c => `<th>${esc(tr(c.label))}${c.maps ? `<small>→ ${esc(tr(c.maps))}</small>` : ''}</th>`).join('')}</tr>`;
    const body = d.rows.map(r => `<tr><th>${esc(tr(r.label))}</th>${d.cols.map(c => {
      const x = cell(r.id, c.id);
      if (!x) return '<td class="empty"></td>';
      const marks = x.posts.map(p => `<i class="m ${p.s}" style="color:${col(p.g)}" title="${esc(p.h)} · ${esc(tr(d.groups[p.g]))} · ${p.s}${p.u ? ' · ' + t('urgent') : ''}"></i>`).join('');
      return `<td><span class="n">${x.posts.length}</span><span class="marks">${marks}</span></td>`;
    }).join('')}</tr>`).join('');
    const used = gids.filter(g => d.cells.some(x => x.posts.some(p => p.g === g)));
    const legend = used.map(g => `<span><i class="m" style="color:${col(g)}"></i>${esc(tr(d.groups[g]))}</span>`).join('') +
      `<span class="sep"></span><span class="enc"><i class="m" style="color:var(--muted-fg)"></i>${t('persists')}</span><span class="enc"><i class="m defects" style="color:var(--muted-fg)"></i>${t('defects')}</span><span class="enc"><i class="m unknown" style="color:var(--muted-fg)"></i>${t('unknown')}</span>`;
    return `<div class="ogrid-wrap"><table class="ogrid"><thead>${head}</thead><tbody>${body}</tbody></table></div><div class="ogrid-legend">${legend}</div>`;
  }

  marked.use({
    gfm: true,
    renderer: {
      code(code, lang) {
        const l = (lang || '').trim();
        if (l === 'quote') return quoteCard(code);
        if (l === 'empathy-map') return empathyMap(code);
        if (l === 'timeline') return timeline(code);
        if (l === 'occasion-grid') return occasionGrid(code);
        if (l === 'summary') return summary(code);
        if (l === 'cluster-map') return clusterMap(code);
        if (l === 'persona') return persona(code);
        return `<pre><code>${esc(code)}</code></pre>`;
      }
    }
  });

  // --- Navigation -----------------------------------------------------------
  function flatten(nav) {
    const out = [];
    nav.sections.forEach(sec => (sec.items || []).forEach(it => {
      if (it.children) it.children.forEach(ch => out.push({ ...ch, sec, grp: it }));
      else out.push({ ...it, sec });
    }));
    return out;
  }
  function renderNav(filter = '') {
    const f = filter.trim().toLowerCase();
    const match = p => !f || L(p).toLowerCase().includes(f) || L(p.grp).toLowerCase().includes(f);
    let html = '';
    NAV.sections.forEach(sec => {
      if (sec.disabled) {
        if (f) return;
        const note = LANG === 'pt' && sec.note_pt ? sec.note_pt : sec.note;
        html += `<div class="nav-group is-disabled"><div class="nav-group-title">${esc(L(sec))}<span class="badge">${t('soon')}</span></div>${note ? `<div class="nav-empty">${esc(note)}</div>` : ''}</div>`;
        return;
      }
      let inner = '';
      (sec.items || []).forEach(it => {
        if (it.children) {
          const kids = it.children.filter(ch => match({ ...ch, grp: it }));
          if (kids.length) inner += `<div class="nav-sub-title">${esc(L(it))}</div><div class="nav-sub">${kids.map(link).join('')}</div>`;
        } else if (match(it)) inner += link(it);
      });
      if (inner) html += `<div class="nav-group"><div class="nav-group-title">${esc(L(sec))}</div>${inner}</div>`;
    });
    els.nav.innerHTML = html || `<div class="nav-empty">${t('noMatch')} “${esc(filter)}”.</div>`;
    markCurrent();
  }
  const link = p => `<a class="nav-link" href="#${p.id}" data-id="${p.id}">${esc(L(p))}</a>`;
  function markCurrent() {
    const id = currentId();
    els.nav.querySelectorAll('.nav-link').forEach(a => {
      if (a.dataset.id === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  const currentId = () => {
    const h = decodeURIComponent(location.hash.slice(1));
    return PAGES.some(p => p.id === h) ? h : PAGES[0].id;
  };

  // --- Links between Markdown files ------------------------------------------
  function resolve(fromSrc, href) {
    const base = fromSrc.split('/').slice(0, -1);
    href.split('/').forEach(part => {
      if (part === '..') base.pop(); else if (part && part !== '.') base.push(part);
    });
    return base.join('/');
  }

  // --- Page rendering -------------------------------------------------------
  async function load(src) {
    if (cache.has(src)) return cache.get(src);
    const res = await fetch(src, { cache: 'no-store' });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const text = await res.text();
    cache.set(src, text);
    return text;
  }
  async function render() {
    const id = currentId();
    const page = PAGES.find(p => p.id === id);
    markCurrent();
    closeNav();
    let md, src = srcFor(page.src), fallback = false;
    try { md = await load(src); }
    catch (e) {
      if (src !== page.src) {
        try { md = await load(page.src); src = page.src; fallback = true; } catch (e2) {}
      }
      if (md === undefined) {
        els.content.innerHTML = `<h1 class="page-title">${esc(L(page))}</h1><p class="state">${t('loadFail')(esc(src), esc(e.message))}</p>`;
        els.toc.innerHTML = '';
        return;
      }
    }
    const tmp = document.createElement('div');
    tmp.innerHTML = marked.parse(md);

    // Title and lede come from the Markdown's own H1 and first paragraph.
    const h1 = tmp.querySelector('h1');
    const title = h1 ? h1.innerHTML : esc(L(page));
    if (h1) h1.remove();
    let lede = '';
    const first = tmp.firstElementChild;
    if (first && first.tagName === 'P' && !first.querySelector('img')) { lede = first.innerHTML; first.remove(); }

    // Headings get ids for the TOC; tables get a scroll wrapper; links get routed.
    const used = new Set();
    tmp.querySelectorAll('h2, h3').forEach(h => {
      let s = slug(h.textContent) || 'section', n = 2;
      while (used.has(s)) s = `${slug(h.textContent)}-${n++}`;
      used.add(s); h.id = s;
    });
    tmp.querySelectorAll('table').forEach(t => {
      const cols = t.rows[0] ? t.rows[0].cells.length : 0;
      const emptyHead = t.tHead && ![...t.tHead.querySelectorAll('th')].some(th => th.textContent.trim());
      if (cols <= 3 && !emptyHead && t.rows.length <= 8) t.classList.add('fit');
    });
    tmp.querySelectorAll('table').forEach(t => {
      if (t.classList.contains('ogrid')) return;
      const w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.appendChild(t);
      const heads = [...t.querySelectorAll('thead th')];
      if (heads.length && heads.every(th => !th.textContent.trim())) t.classList.add('kv');
      if (heads.length >= 6) t.classList.add('is-wide');
      // Columns holding only numbers (counts, percentages, ranges) are right-aligned.
      const rows = [...t.querySelectorAll('tbody tr')];
      heads.forEach((th, i) => {
        if (i === 0) return;
        const cells = rows.map(r => r.children[i]).filter(c => c && c.textContent.trim());
        if (!cells.length) return;
        const kind = cells.every(c => /^[\d.,%–—\-+~\s]+$/.test(c.textContent.trim())) && cells.some(c => /\d/.test(c.textContent)) ? 'num'
          : cells.every(c => c.textContent.trim().length <= 2) ? 'sym' : '';
        if (kind) { th.classList.add(kind); rows.forEach(r => r.children[i]?.classList.add(kind)); }
      });
    });
    // A persona block right under an H2 with the same name doesn't repeat the name.
    tmp.querySelectorAll('.persona').forEach(p => {
      const h = p.previousElementSibling;
      if (h && /^H[23]$/.test(h.tagName) && h.textContent.trim() === p.dataset.name) p.querySelector('.persona-name')?.remove();
    });
    tmp.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (/^https?:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; return; }
      if (href.startsWith('#')) return;
      const [path, frag] = href.split('#');
      if (path.endsWith('.md')) {
        const target = BY_SRC.get(canon(resolve(src, path)));
        if (target) a.setAttribute('href', `#${target.id}`);
        else { a.removeAttribute('href'); a.title = t('notPublished'); }
      }
    });
    // Images are written relative to their Markdown file.
    const srcOf = src;
    tmp.querySelectorAll('img[data-src], img[src]').forEach(img => {
      const src = img.getAttribute('data-src') || img.getAttribute('src');
      if (!/^(https?:|data:|\/)/.test(src)) img.setAttribute('src', resolve(srcOf, src));
      img.removeAttribute('data-src');
    });
    // Consecutive quote cards sit in a grid.
    let run = [];
    const flush = () => { if (run.length > 1) { const g = document.createElement('div'); g.className = 'quote-grid'; run[0].before(g); run.forEach(c => g.appendChild(c)); } run = []; };
    [...tmp.children].forEach(el => { if (el.classList.contains('quote-card')) run.push(el); else flush(); });
    flush();

    const idx = PAGES.indexOf(page);
    const prev = PAGES[idx - 1], next = PAGES[idx + 1];
    const crumbs = [L(page.sec), page.grp ? L(page.grp) : ''].filter(Boolean).map(esc).join('<span aria-hidden="true">›</span>');

    els.content.innerHTML = `
      <div class="crumbs">${crumbs}</div>
      <h1 class="page-title">${title}</h1>
      ${lede ? `<p class="page-lede">${lede}</p>` : ''}
      <div class="page-meta"><code>${esc(src)}</code>${page.updated ? `<span>Updated ${esc(page.updated)}</span>` : ''}</div>
      ${fallback ? `<p class="lang-note">${t('notTranslated')}</p>` : ''}
      <div class="prose">${tmp.innerHTML}</div>
      <nav class="pager" aria-label="Pages">
        ${prev ? `<a class="prev" href="#${prev.id}"><span class="dir">${t('prev')}</span><span class="ttl">${esc(L(prev))}</span></a>` : ''}
        ${next ? `<a class="next" href="#${next.id}"><span class="dir">${t('next')}</span><span class="ttl">${esc(L(next))}</span></a>` : ''}
      </nav>`;
    document.title = `${L(page)} · High Street Docs`;
    buildToc();
    window.scrollTo(0, 0);
  }
  function buildToc() {
    const hs = [...els.content.querySelectorAll('.prose h2, .prose h3')];
    if (tocObserver) tocObserver.disconnect();
    if (hs.length < 2) { els.toc.innerHTML = ''; return; }
    els.toc.innerHTML = `<p class="toc-title">${t('onPage')}</p><ul>${hs.map(h => `<li class="lvl-${h.tagName[1]}"><a href="#${currentId()}" data-target="${h.id}">${esc(h.textContent)}</a></li>`).join('')}</ul>`;
    els.toc.querySelectorAll('a').forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      document.getElementById(a.dataset.target)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }));
    tocObserver = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) els.toc.querySelectorAll('a').forEach(a => a.classList.toggle('is-active', a.dataset.target === en.target.id));
      });
    }, { rootMargin: '-80px 0px -70% 0px' });
    hs.forEach(h => tocObserver.observe(h));
  }

  // --- Mobile sheet -----------------------------------------------------------
  function openNav() { document.body.classList.add('nav-open'); els.scrim.hidden = false; els.menu.setAttribute('aria-expanded', 'true'); }
  function closeNav() { document.body.classList.remove('nav-open'); els.scrim.hidden = true; els.menu.setAttribute('aria-expanded', 'false'); }
  els.menu.addEventListener('click', () => document.body.classList.contains('nav-open') ? closeNav() : openNav());
  els.scrim.addEventListener('click', closeNav);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeNav();
    if (e.key === '/' && document.activeElement !== els.search) { e.preventDefault(); els.search.focus(); }
  });
  els.search.addEventListener('input', () => renderNav(els.search.value));
  document.querySelectorAll('#theme-seg button').forEach(b => b.addEventListener('click', () => { MODE = b.dataset.mode; store.set('hs-theme', MODE); applyMode(); }));
  document.querySelectorAll('#lang-seg button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.lang === LANG) return;
    LANG = b.dataset.lang; store.set('hs-lang', LANG); applyLangUI(); renderNav(els.search.value); render();
  }));
  applyLangUI();

  fetch('site/nav.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(nav => {
      NAV = nav; PAGES = flatten(nav); BY_SRC = new Map(PAGES.map(p => [p.src, p]));
      renderNav();
      window.addEventListener('hashchange', render);
      render();
    })
    .catch(e => { els.content.innerHTML = `<p class="state">Couldn’t load the navigation (${esc(e.message)}).</p>`; });
})();
</script>
