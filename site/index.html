<title>High Street Docs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* Layout: docs shell. Sticky top bar, left nav (IA), reading column, right "on this page" rail. Neutral zinc tokens in the shadcn/ui idiom. */
:root {
  --bg: #ffffff;
  --bg-subtle: #fafafa;
  --fg: #09090b;
  --muted: #f4f4f5;
  --muted-fg: #71717a;
  --border: #e4e4e7;
  --primary: #18181b;
  --primary-fg: #fafafa;
  --ring: #a1a1aa;
  --link: #18181b;
  --quote-bar: #d4d4d8;
  --c1: #2563eb; --c2: #d97706; --c3: #059669; --c4: #9333ea; --c5: #dc2626;
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 8px;
  --header-h: 56px;
  --sidebar-w: 264px;
  --toc-w: 220px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090b; --bg-subtle: #0c0c0e; --fg: #fafafa; --muted: #18181b; --muted-fg: #a1a1aa;
    --border: #27272a; --primary: #fafafa; --primary-fg: #18181b; --ring: #52525b; --link: #fafafa; --quote-bar: #3f3f46;
    --c1: #60a5fa; --c2: #fbbf24; --c3: #34d399; --c4: #c084fc; --c5: #f87171;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090b; --bg-subtle: #0c0c0e; --fg: #fafafa; --muted: #18181b; --muted-fg: #a1a1aa;
  --border: #27272a; --primary: #fafafa; --primary-fg: #18181b; --ring: #52525b; --link: #fafafa; --quote-bar: #3f3f46;
  --c1: #60a5fa; --c2: #fbbf24; --c3: #34d399; --c4: #c084fc; --c5: #f87171;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-sans); font-size: 15px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 4px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  height: var(--header-h); display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.brand-mark {
  width: 26px; height: 26px; border-radius: 6px; background: var(--primary); color: var(--primary-fg);
  display: grid; place-items: center; font-weight: 600; font-size: 12px; letter-spacing: .02em; flex: none;
}
.brand-name { font-weight: 600; font-size: 14px; white-space: nowrap; }
.brand-sub { color: var(--muted-fg); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sep { color: var(--border); }
.topbar-spacer { flex: 1; }
.phase-pill {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
  border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; color: var(--muted-fg); white-space: nowrap;
}
.phase-pill b { color: var(--fg); font-weight: 500; }
.menu-btn {
  display: none; width: 36px; height: 36px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--fg); cursor: pointer; place-items: center; flex: none;
}

/* Shell */
.shell {
  display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  max-width: 1440px; margin: 0 auto;
}
.sidebar {
  position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px));
  height: calc(100vh - var(--header-h) - env(safe-area-inset-top, 0px));
  overflow-y: auto; border-right: 1px solid var(--border);
  padding: 20px 12px 40px max(16px, env(safe-area-inset-left, 0px));
  background: var(--bg);
}
.search {
  width: 100%; height: 34px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--fg); font: inherit; font-size: 13px; padding: 0 10px; margin-bottom: 18px;
}
.search::placeholder { color: var(--muted-fg); }
.nav-group { display: flex; flex-direction: column; gap: 1px; margin-bottom: 20px; }
.nav-group-title {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; font-weight: 600; padding: 0 8px 6px; color: var(--fg);
}
.nav-group.is-disabled .nav-group-title { color: var(--muted-fg); }
.badge {
  font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted-fg); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; line-height: 16px;
}
.nav-link {
  display: block; text-decoration: none; font-size: 13.5px; line-height: 1.4; color: var(--muted-fg);
  padding: 6px 8px; border-radius: 6px;
}
.nav-link:hover { color: var(--fg); background: var(--muted); }
.nav-link[aria-current="page"] { color: var(--fg); background: var(--muted); font-weight: 500; }
.nav-sub { display: flex; flex-direction: column; gap: 1px; margin: 2px 0 2px 12px; padding-left: 8px; border-left: 1px solid var(--border); }
.nav-sub-title { font-size: 13.5px; color: var(--fg); padding: 6px 8px 2px; }
.nav-empty { font-size: 13px; color: var(--muted-fg); padding: 6px 8px; }

/* Main */
.main {
  display: grid; grid-template-columns: minmax(0, 1fr) var(--toc-w); gap: 48px;
  padding: 36px max(16px, env(safe-area-inset-right, 0px)) 80px 48px; min-width: 0;
}
.content { min-width: 0; max-width: 760px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted-fg); margin-bottom: 10px; }
.crumbs span[aria-hidden] { opacity: .6; }
.page-title { font-size: 32px; line-height: 1.2; letter-spacing: -.02em; font-weight: 600; margin: 0 0 10px; text-wrap: balance; }
.page-lede { font-size: 17px; color: var(--muted-fg); margin: 0 0 14px; max-width: 65ch; }
.page-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-family: var(--font-mono); font-size: 12px; color: var(--muted-fg); padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }

/* Prose */
.prose > :first-child { margin-top: 0; }
.prose p, .prose li { max-width: 68ch; }
.prose h2 { font-size: 22px; line-height: 1.3; letter-spacing: -.01em; font-weight: 600; margin: 44px 0 12px; padding-top: 4px; scroll-margin-top: 80px; text-wrap: balance; }
.prose h3 { font-size: 17px; line-height: 1.4; font-weight: 600; margin: 30px 0 8px; scroll-margin-top: 80px; }
.prose h4 { font-size: 15px; font-weight: 600; margin: 22px 0 6px; }
.prose p { margin: 0 0 14px; }
.prose ul, .prose ol { padding-left: 22px; margin: 0 0 16px; }
.prose li { margin: 4px 0; }
.prose li::marker { color: var(--muted-fg); }
.prose a { color: var(--link); text-decoration: underline; text-decoration-color: var(--ring); text-underline-offset: 3px; }
.prose a:hover { text-decoration-color: currentColor; }
.prose strong { font-weight: 600; }
.prose hr { border: 0; border-top: 1px solid var(--border); margin: 36px 0; }
.prose code { font-family: var(--font-mono); font-size: .86em; background: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
.prose pre { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; overflow-x: auto; font-size: 13px; line-height: 1.6; }
.prose pre code { background: none; border: 0; padding: 0; }
.prose blockquote { margin: 0 0 16px; padding: 2px 0 2px 16px; border-left: 2px solid var(--quote-bar); color: var(--muted-fg); }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); margin: 0 0 20px; }
.prose table { width: 100%; border-collapse: collapse; font-size: 13.5px; line-height: 1.5; }
.prose th { text-align: left; font-weight: 500; color: var(--muted-fg); background: var(--bg-subtle); white-space: nowrap; }
.prose th, .prose td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.prose tr:last-child td { border-bottom: 0; }
.prose td { font-variant-numeric: tabular-nums; }

/* Evidence: quote cards */
.quote-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px 14px; margin: 0 0 12px; background: var(--bg); }
.quote-text { font-size: 15.5px; line-height: 1.55; margin: 0 0 12px; }
.quote-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-family: var(--font-mono); font-size: 12px; color: var(--muted-fg); }
.quote-meta .handle { color: var(--fg); font-weight: 500; }
.quote-meta a { color: var(--muted-fg); text-decoration: none; margin-left: auto; }
.quote-meta a:hover { color: var(--fg); }
.status { font-size: 10.5px; letter-spacing: .03em; text-transform: uppercase; border-radius: 4px; padding: 0 6px; line-height: 18px; border: 1px solid var(--border); }
.status-verified { color: var(--fg); background: var(--muted); }
.status-archive { color: var(--muted-fg); border-style: dashed; }
.quote-context { font-size: 13px; color: var(--muted-fg); margin: 8px 0 0; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.tag { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--border); background: var(--bg-subtle); border-radius: 4px; padding: 0 6px; color: var(--muted-fg); }
.quote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; margin: 0 0 20px; align-items: start; }
.quote-grid .quote-card { margin: 0; }

/* Empathy map (Strategyzer canvas order) */
.empathy { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin: 8px 0 24px; }
.empathy-cell { padding: 16px 18px; border-bottom: 1px solid var(--border); min-width: 0; }
.empathy-cell:nth-child(odd) { border-right: 1px solid var(--border); }
.empathy-cell.wide { grid-column: 1 / -1; border-right: 0; }
.empathy-cell:last-child, .empathy-cell.pains { border-bottom: 0; }
.empathy-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-fg); margin: 0 0 8px; }
.empathy-cell ul { margin: 0; padding-left: 18px; font-size: 14px; }
.empathy-cell li { margin: 5px 0; }
.empathy-cell.pains, .empathy-cell.gains { background: var(--bg-subtle); }

/* Timeline */
.timeline { list-style: none; padding: 0; margin: 4px 0 24px; border-left: 1px solid var(--border); }
.timeline li { position: relative; padding: 0 0 18px 20px; max-width: none; margin: 0; }
.timeline li::before { content: ""; position: absolute; left: -4px; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--bg); border: 1px solid var(--muted-fg); }
.timeline time { display: block; font-family: var(--font-mono); font-size: 12px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }

/* Page summary: key takeaways + AI in this step */
.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); margin: 0 0 28px; overflow: hidden; }
.summary section { padding: 14px 18px 12px; min-width: 0; background: var(--bg); }
.summary section.ai, .summary section.tradeoffs { background: var(--bg-subtle); }
.summary section:only-child, .summary section:last-child:nth-child(odd) { grid-column: 1 / -1; }
.summary h5 { margin: 0 0 8px; font: 500 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted-fg); }
.summary ul { margin: 0; padding-left: 18px; font-size: 14px; }
.summary li { margin: 4px 0; max-width: none; }
@media (max-width: 860px) { .summary { grid-template-columns: minmax(0, 1fr); } }

/* Persona header: avatar, name, attributes */
.persona { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 20px; align-items: start; border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin: 4px 0 18px; }
.persona img { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; display: block; background: var(--muted); }
.persona .credit { display: block; font-size: 11px; color: var(--muted-fg); margin-top: 6px; text-align: center; line-height: 1.3; }
.persona .credit a { color: inherit; }
.persona h3 { margin: 0 0 4px !important; font-size: 18px; }
.persona .ptag { display: block; color: var(--muted-fg); font-size: 14px; margin: 0 0 12px; }
.persona dl { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 6px 12px; margin: 0; font-size: 13.5px; }
.persona dt { color: var(--muted-fg); }
.persona dd { margin: 0; }
.persona .src { font: 500 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: .04em; border-radius: 4px; padding: 0 6px; line-height: 18px; border: 1px solid var(--border); justify-self: start; }
.persona .src.evidence { color: var(--fg); background: var(--muted); }
.persona .src.assumed { color: var(--muted-fg); border-style: dashed; }
@media (max-width: 560px) { .persona { grid-template-columns: minmax(0, 1fr); } .persona figure { justify-self: start; } .persona dl { grid-template-columns: max-content minmax(0, 1fr); } .persona .src { grid-column: 2; } }

/* Cluster map: need x where it broke */
.cmap { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 16px 12px; margin: 8px 0 24px; }
.cmap svg { display: block; width: 100%; height: auto; }
.cmap .gl { stroke: var(--border); }
.cmap .tk { fill: var(--muted-fg); font: 400 11px var(--font-sans); }
.cmap .ax { fill: var(--muted-fg); font: 500 10.5px var(--font-mono); letter-spacing: .05em; text-transform: uppercase; }
.cmap .zone { fill-opacity: .07; stroke-opacity: .5; stroke-dasharray: 4 4; }
.cmap .pt { stroke-width: 2; }
.cmap .pt.defects { fill: var(--bg) !important; }
.cmap .pt.unknown { fill-opacity: .45; stroke-opacity: .6; }
.cmap .cl { fill: var(--fg); font: 600 13px var(--font-sans); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.cmap .cn { fill: var(--muted-fg); font: 400 11px var(--font-mono); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.cmap-foot { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; color: var(--muted-fg); }
.cmap-foot span { display: inline-flex; align-items: center; gap: 6px; }
.cmap-note { font-size: 12.5px; color: var(--muted-fg); margin: 8px 0 0; }

/* Occasion grid (job x where it broke) */
.ogrid-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); margin: 8px 0 8px; }
.ogrid { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 13px; }
.ogrid th, .ogrid td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 10px 12px; vertical-align: top; text-align: left; }
.ogrid tr > :last-child { border-right: 0; }
.ogrid tbody tr:last-child > * { border-bottom: 0; }
.ogrid thead th { background: var(--bg-subtle); font-weight: 500; }
.ogrid thead th small { display: block; font: 400 11px var(--font-mono); color: var(--muted-fg); letter-spacing: .02em; }
.ogrid tbody th { font-weight: 500; width: 150px; background: var(--bg-subtle); }
.ogrid .n { font: 500 12px var(--font-mono); color: var(--muted-fg); display: block; margin-bottom: 6px; }
.ogrid .marks { display: flex; flex-wrap: wrap; gap: 4px; }
i.m { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; background: currentColor; display: inline-block; }
i.m.defects { background: transparent; }
i.m.unknown { opacity: .5; }
.ogrid td.empty { background: transparent; }
.ogrid-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted-fg); margin: 10px 0 24px; }
.ogrid-legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Prev / next */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--border); }
.pager a { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; text-decoration: none; min-width: 0; }
.pager a:hover { background: var(--muted); }
.pager .dir { font-size: 12px; color: var(--muted-fg); }
.pager .ttl { font-weight: 500; font-size: 14px; }
.pager .next { text-align: right; grid-column: 2; }

/* On this page */
.toc { position: sticky; top: calc(var(--header-h) + 36px); align-self: start; max-height: calc(100vh - var(--header-h) - 72px); overflow-y: auto; font-size: 13px; }
.toc-title { font-weight: 600; margin: 0 0 8px; font-size: 13px; }
.toc ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
.toc a { display: block; text-decoration: none; color: var(--muted-fg); padding: 3px 0; line-height: 1.4; }
.toc a:hover, .toc a.is-active { color: var(--fg); }
.toc .lvl-3 a { padding-left: 12px; }

.state { color: var(--muted-fg); font-size: 14px; padding: 24px 0; }
.skeleton { height: 14px; border-radius: 4px; background: var(--muted); margin: 10px 0; }

/* Responsive */
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .toc { display: none; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: grid; }
  .brand-sub, .brand-sep { display: none; }
  .sidebar {
    position: fixed; z-index: 30; left: 0; top: calc(var(--header-h) + env(safe-area-inset-top, 0px)); bottom: 0;
    height: auto; width: min(300px, 86vw); transform: translateX(-102%); transition: transform .2s ease;
    padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 10px 30px rgba(0,0,0,.12);
  }
  body.nav-open .sidebar { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.35); }
  .main { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
  .page-title { font-size: 26px; }
  .empathy { grid-template-columns: minmax(0, 1fr); }
  .empathy-cell:nth-child(odd) { border-right: 0; }
  .empathy-cell.pains { border-bottom: 1px solid var(--border); }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .next { grid-column: 1; }
}
@media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } html { scroll-behavior: auto; } }
</style>

<header class="topbar">
  <button class="menu-btn" id="menu-btn" aria-label="Open navigation" aria-expanded="false">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#introduction">
    <span class="brand-mark" aria-hidden="true">HS</span>
    <span class="brand-name">High Street</span>
    <span class="brand-sep" aria-hidden="true">/</span>
    <span class="brand-sub">Design take-home, process docs</span>
  </a>
  <span class="topbar-spacer"></span>
  <span class="phase-pill">Phase · <b id="phase-now">Discover</b></span>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Documentation">
    <input class="search" id="search" type="search" placeholder="Filter pages" aria-label="Filter pages" autocomplete="off">
    <div id="nav"></div>
  </nav>
  <main class="main">
    <article class="content" id="content" aria-live="polite">
      <div class="skeleton" style="width:40%"></div><div class="skeleton"></div><div class="skeleton" style="width:85%"></div>
    </article>
    <aside class="toc" id="toc" aria-label="On this page"></aside>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>

<script>
(() => {
  // Served from the repo root in dev (site/serve.py) and from the artifact root when published,
  // so every content path is the repo-relative path, e.g. docs/discover/index.md.
  const $ = (s, el = document) => el.querySelector(s);
  const els = { nav: $('#nav'), content: $('#content'), toc: $('#toc'), search: $('#search'), sidebar: $('#sidebar'), scrim: $('#scrim'), menu: $('#menu-btn'), phase: $('#phase-now') };
  const cache = new Map();
  let NAV = null, PAGES = [], BY_SRC = new Map(), tocObserver = null;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = s => s.toLowerCase().replace(/<[^>]+>/g, '').replace(/&[a-z]+;/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const inline = s => marked.parseInline(s || '');

  // --- Custom fenced blocks -------------------------------------------------
  // ```quote      text/handle/network/date/url/tags/context, one "key: value" per line
  // ```empathy-map  "Label:" lines followed by "- bullet" lines
  // ```timeline   "- YYYY-MM-DD — text" lines
  function kv(src) {
    const o = {};
    src.split('\n').forEach(line => {
      const i = line.indexOf(':');
      if (i > 0) o[line.slice(0, i).trim().toLowerCase()] = line.slice(i + 1).trim();
    });
    return o;
  }
  function quoteCard(src) {
    const q = kv(src);
    const text = (q.text || '').replace(/^["“]|["”]$/g, '');
    const tags = (q.tags || '').split(',').map(t => t.trim()).filter(Boolean);
    return `<figure class="quote-card"><blockquote class="quote-text" style="margin:0 0 12px">“${inline(esc(text))}”</blockquote>
      <figcaption class="quote-meta"><span class="handle">${esc(q.handle || 'unknown')}</span><span>${esc(q.network || '')}</span><time>${esc(q.date || '')}</time>${q.status ? `<span class="status status-${esc(q.status)}" title="${q.status === 'verified' ? 'Checked against the live source' : 'Collected from a public archive; not yet checked against the live source'}">${q.status === 'verified' ? 'Verified' : 'Via archive'}</span>` : ''}${q.url ? `<a href="${esc(q.url)}" target="_blank" rel="noopener">Source ↗</a>` : ''}</figcaption>
      ${q.context ? `<p class="quote-context">${inline(esc(q.context))}</p>` : ''}
      ${tags.length ? `<div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}</figure>`;
  }
  function empathyMap(src) {
    const cells = []; let cur = null;
    src.split('\n').forEach(line => {
      const t = line.trim(); if (!t) return;
      if (t.startsWith('- ')) { if (cur) cur.items.push(t.slice(2)); }
      else if (t.endsWith(':')) { cur = { label: t.slice(0, -1), items: [] }; cells.push(cur); }
    });
    return `<div class="empathy">${cells.map(c => {
      const k = slug(c.label);
      const wide = (k === 'say-and-do' || k === 'say-do') ? ' wide' : '';
      return `<section class="empathy-cell ${k}${wide}"><p class="empathy-label">${esc(c.label)}</p><ul>${c.items.map(i => `<li>${inline(i)}</li>`).join('')}</ul></section>`;
    }).join('')}</div>`;
  }
  function timeline(src) {
    const items = src.split('\n').map(l => l.trim()).filter(l => l.startsWith('- ')).map(l => {
      const m = l.slice(2).match(/^(\d{4}-\d{2}(?:-\d{2})?)\s*[—–-]\s*(.*)$/);
      return m ? `<li><time>${m[1]}</time>${inline(m[2])}</li>` : `<li>${inline(l.slice(2))}</li>`;
    });
    return `<ol class="timeline">${items.join('')}</ol>`;
  }
  // ```summary  "Takeaways:", "Call:", "AI:" and "Trade-offs:" headings, each followed by "- " bullets. Sits at the top of a page.
  function summary(src) {
    const parts = {}; let cur = null;
    src.split('\n').forEach(line => {
      const t = line.trim(); if (!t) return;
      if (t.startsWith('- ')) { if (cur) parts[cur].push(t.slice(2)); }
      else if (t.endsWith(':')) { cur = t.slice(0, -1).toLowerCase(); parts[cur] = []; }
    });
    const sec = (key, title) => parts[key] ? `<section class="${key.replace(/[^a-z]/g, '')}"><h5>${title}</h5><ul>${parts[key].map(i => `<li>${inline(i)}</li>`).join('')}</ul></section>` : '';
    return `<div class="summary">${sec('takeaways', 'Key takeaways')}${sec('call', 'My call')}${sec('ai', 'AI in this step')}${sec('trade-offs', 'Trade-offs')}</div>`;
  }

  // ```persona  key: value lines (name, tagline, image, credit, credit_url) and "- Label: value | evidence|assumed" attributes.
  function persona(src) {
    const q = {}, attrs = [];
    src.split('\n').forEach(line => {
      const t = line.trim(); if (!t) return;
      if (t.startsWith('- ')) {
        const [body, kind = ''] = t.slice(2).split('|').map(x => x.trim());
        const i = body.indexOf(':');
        attrs.push({ k: body.slice(0, i).trim(), v: body.slice(i + 1).trim(), kind: kind.toLowerCase() });
      } else { const i = t.indexOf(':'); if (i > 0) q[t.slice(0, i).trim()] = t.slice(i + 1).trim(); }
    });
    const img = q.image ? `<figure style="margin:0"><img data-src="${esc(q.image)}" alt="Photo standing in for ${esc(q.name || 'the persona')}">${q.credit ? `<span class="credit">${q.credit_url ? `<a href="${esc(q.credit_url)}" target="_blank" rel="noopener">${esc(q.credit)}</a>` : esc(q.credit)}</span>` : ''}</figure>` : '<span></span>';
    return `<div class="persona">${img}<div><h3>${esc(q.name || '')}</h3><span class="ptag">${inline(q.tagline || '')}</span><dl>${attrs.map(a => `<dt>${esc(a.k)}</dt><dd>${inline(a.v)}</dd>${a.kind ? `<span class="src ${esc(a.kind)}">${esc(a.kind)}</span>` : '<span></span>'}`).join('')}</dl></div></div>`;
  }

  // ```cluster-map  JSON from scripts/build_personas.py: posts on need x where it broke, k-means clusters.
  function clusterMap(src) {
    let d;
    try { d = JSON.parse(src); } catch (e) { return `<pre><code>${esc(src)}</code></pre>`; }
    const W = 680, H = 440, L = 128, R = 24, T = 24, B = 52;
    const sx = v => L + (v / 10.5) * (W - L - R), sy = v => T + (1 - v / 10) * (H - T - B);
    const ids = Object.keys(d.names);
    const col = c => `var(--c${ids.indexOf(c) + 1})`;
    // Posts with the same codes share a coordinate; lay them out in a small grid around it.
    const groups = {};
    d.points.forEach(p => (groups[`${p.x},${p.y}`] = groups[`${p.x},${p.y}`] || []).push(p));
    const placed = [];
    Object.values(groups).forEach(list => list.forEach((p, i) => {
      const per = Math.ceil(Math.sqrt(list.length)), r = Math.floor(i / per), c = i % per;
      const off = 13, w = (Math.min(per, list.length) - 1) * off, h = (Math.ceil(list.length / per) - 1) * off;
      placed.push({ ...p, cx: sx(p.x) - w / 2 + c * off, cy: sy(p.y) - h / 2 + r * off });
    }));
    let g = '';
    d.x.ticks.forEach(([v, t]) => g += `<line class="gl" x1="${sx(v)}" x2="${sx(v)}" y1="${sy(10)}" y2="${sy(0)}"/><text class="tk" x="${sx(v)}" y="${sy(0) + 18}" text-anchor="middle">${esc(t)}</text>`);
    d.y.ticks.forEach(([v, t]) => g += `<line class="gl" x1="${sx(0)}" x2="${sx(10.5)}" y1="${sy(v)}" y2="${sy(v)}"/><text class="tk" x="${L - 10}" y="${sy(v) + 4}" text-anchor="end">${esc(t)}</text>`);
    g += `<text class="ax" x="${sx(0)}" y="${H - 6}">← ${esc(d.x.min)}</text><text class="ax" x="${sx(10.5)}" y="${H - 6}" text-anchor="end">${esc(d.x.max)} →</text>`;
    g += `<text class="ax" x="8" y="${sy(10) + 4}">↑ ${esc(d.y.max)}</text><text class="ax" x="8" y="${sy(0)}">↓ ${esc(d.y.min)}</text>`;
    // A soft zone around each cluster: the box around its points, padded.
    ids.forEach(c => {
      const mine = placed.filter(p => p.c === c); if (!mine.length) return;
      const xs = mine.map(p => p.cx), ys = mine.map(p => p.cy), pad = 16;
      const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
      g += `<rect class="zone" x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" rx="14" fill="${col(c)}" stroke="${col(c)}"/>`;
    });
    g += placed.map(p => `<circle class="pt ${p.s}" cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="5" fill="${col(p.c)}" stroke="${col(p.c)}"><title>${esc(p.h)} · ${esc(d.names[p.c])} · ${p.s}</title></circle>`).join('');
    ids.forEach(c => {
      const mine = placed.filter(p => p.c === c); if (!mine.length) return;
      const top = Math.min(...mine.map(p => p.cy)) - 24, mid = mine.reduce((a, p) => a + p.cx, 0) / mine.length;
      const name = d.names[c].split(',')[0], n = d.centres[c].n;
      g += `<text class="cl" x="${mid}" y="${top}" text-anchor="middle">${esc(name)} <tspan class="cn">(${n})</tspan></text>`;
    });
    const legend = ids.map(c => `<span><i class="m" style="color:${col(c)}"></i>${esc(d.names[c])}</span>`).join('') +
      `<span><i class="m" style="color:var(--fg)"></i>kept going</span><span><i class="m defects" style="color:var(--fg)"></i>gave up on local</span><span><i class="m unknown" style="color:var(--fg)"></i>not shown</span>`;
    return `<figure class="cmap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Posts by need and by where the occasion broke, grouped into clusters">${g}</svg>
      <figcaption><div class="cmap-foot">${legend}</div><p class="cmap-note">Each dot is one post; posts with the same codes sit side by side. Not on the chart: ${d.worked.length} posts where nothing broke.</p></figcaption></figure>`;
  }

  // ```occasion-grid  JSON from scripts/build_personas.py: jobs x where the occasion broke, one mark per post.
  function occasionGrid(src) {
    let d;
    try { d = JSON.parse(src); } catch (e) { return `<pre><code>${esc(src)}</code></pre>`; }
    const gids = Object.keys(d.groups);
    const col = g => g === 'worked' ? 'var(--muted-fg)' : `var(--c${gids.indexOf(g) + 1})`;
    const cell = (r, c) => d.cells.find(x => x.row === r && x.col === c);
    const head = `<tr><th></th>${d.cols.map(c => `<th>${esc(c.label)}${c.maps ? `<small>→ ${esc(c.maps)}</small>` : ''}</th>`).join('')}</tr>`;
    const body = d.rows.map(r => `<tr><th>${esc(r.label)}</th>${d.cols.map(c => {
      const x = cell(r.id, c.id);
      if (!x) return '<td class="empty"></td>';
      const marks = x.posts.map(p => `<i class="m ${p.s}" style="color:${col(p.g)}" title="${esc(p.h)} · ${esc(d.groups[p.g])} · ${p.s}${p.u ? ' · urgent' : ''}"></i>`).join('');
      return `<td><span class="n">${x.posts.length}</span><span class="marks">${marks}</span></td>`;
    }).join('')}</tr>`).join('');
    const used = gids.filter(g => d.cells.some(x => x.posts.some(p => p.g === g)));
    const legend = used.map(g => `<span><i class="m" style="color:${col(g)}"></i>${esc(d.groups[g])}</span>`).join('') +
      `<span><i class="m" style="color:var(--fg)"></i>persists</span><span><i class="m defects" style="color:var(--fg)"></i>defects</span><span><i class="m unknown" style="color:var(--fg)"></i>stance unknown</span>`;
    return `<div class="ogrid-wrap"><table class="ogrid"><thead>${head}</thead><tbody>${body}</tbody></table></div><div class="ogrid-legend">${legend}</div>`;
  }

  marked.use({
    gfm: true,
    renderer: {
      code(code, lang) {
        const l = (lang || '').trim();
        if (l === 'quote') return quoteCard(code);
        if (l === 'empathy-map') return empathyMap(code);
        if (l === 'timeline') return timeline(code);
        if (l === 'occasion-grid') return occasionGrid(code);
        if (l === 'summary') return summary(code);
        if (l === 'cluster-map') return clusterMap(code);
        if (l === 'persona') return persona(code);
        return `<pre><code>${esc(code)}</code></pre>`;
      }
    }
  });

  // --- Navigation -----------------------------------------------------------
  function flatten(nav) {
    const out = [];
    nav.sections.forEach(sec => (sec.items || []).forEach(it => {
      if (it.children) it.children.forEach(ch => out.push({ ...ch, section: sec.title, group: it.title }));
      else out.push({ ...it, section: sec.title });
    }));
    return out;
  }
  function renderNav(filter = '') {
    const f = filter.trim().toLowerCase();
    const match = p => !f || p.title.toLowerCase().includes(f) || (p.group || '').toLowerCase().includes(f);
    let html = '';
    NAV.sections.forEach(sec => {
      if (sec.disabled) {
        if (f) return;
        html += `<div class="nav-group is-disabled"><div class="nav-group-title">${esc(sec.title)}<span class="badge">Soon</span></div>${sec.note ? `<div class="nav-empty">${esc(sec.note)}</div>` : ''}</div>`;
        return;
      }
      let inner = '';
      (sec.items || []).forEach(it => {
        if (it.children) {
          const kids = it.children.filter(ch => match({ ...ch, group: it.title }));
          if (kids.length) inner += `<div class="nav-sub-title">${esc(it.title)}</div><div class="nav-sub">${kids.map(link).join('')}</div>`;
        } else if (match(it)) inner += link(it);
      });
      if (inner) html += `<div class="nav-group"><div class="nav-group-title">${esc(sec.title)}</div>${inner}</div>`;
    });
    els.nav.innerHTML = html || `<div class="nav-empty">No pages match “${esc(filter)}”.</div>`;
    markCurrent();
  }
  const link = p => `<a class="nav-link" href="#${p.id}" data-id="${p.id}">${esc(p.title)}</a>`;
  function markCurrent() {
    const id = currentId();
    els.nav.querySelectorAll('.nav-link').forEach(a => {
      if (a.dataset.id === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  const currentId = () => {
    const h = decodeURIComponent(location.hash.slice(1));
    return PAGES.some(p => p.id === h) ? h : PAGES[0].id;
  };

  // --- Links between Markdown files ------------------------------------------
  function resolve(fromSrc, href) {
    const base = fromSrc.split('/').slice(0, -1);
    href.split('/').forEach(part => {
      if (part === '..') base.pop(); else if (part && part !== '.') base.push(part);
    });
    return base.join('/');
  }

  // --- Page rendering -------------------------------------------------------
  async function load(src) {
    if (cache.has(src)) return cache.get(src);
    const res = await fetch(src, { cache: 'no-store' });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const text = await res.text();
    cache.set(src, text);
    return text;
  }
  async function render() {
    const id = currentId();
    const page = PAGES.find(p => p.id === id);
    markCurrent();
    closeNav();
    els.phase.textContent = ['Discover', 'Define', 'Develop', 'Deliver'].includes(page.section) ? page.section : 'Discover';
    let md;
    try { md = await load(page.src); }
    catch (e) {
      els.content.innerHTML = `<h1 class="page-title">${esc(page.title)}</h1><p class="state">Couldn’t load <code>${esc(page.src)}</code> (${esc(e.message)}). Check that the file exists in the repo and is published with the page.</p>`;
      els.toc.innerHTML = '';
      return;
    }
    const tmp = document.createElement('div');
    tmp.innerHTML = marked.parse(md);

    // Title and lede come from the Markdown's own H1 and first paragraph.
    const h1 = tmp.querySelector('h1');
    const title = h1 ? h1.innerHTML : esc(page.title);
    if (h1) h1.remove();
    let lede = '';
    const first = tmp.firstElementChild;
    if (first && first.tagName === 'P' && !first.querySelector('img')) { lede = first.innerHTML; first.remove(); }

    // Headings get ids for the TOC; tables get a scroll wrapper; links get routed.
    const used = new Set();
    tmp.querySelectorAll('h2, h3').forEach(h => {
      let s = slug(h.textContent) || 'section', n = 2;
      while (used.has(s)) s = `${slug(h.textContent)}-${n++}`;
      used.add(s); h.id = s;
    });
    tmp.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.appendChild(t); });
    tmp.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (/^https?:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; return; }
      if (href.startsWith('#')) return;
      const [path, frag] = href.split('#');
      if (path.endsWith('.md')) {
        const target = BY_SRC.get(resolve(page.src, path));
        if (target) a.setAttribute('href', `#${target.id}`);
        else { a.removeAttribute('href'); a.title = 'Not published yet'; }
      }
    });
    // Images are written relative to their Markdown file.
    tmp.querySelectorAll('img[data-src], img[src]').forEach(img => {
      const src = img.getAttribute('data-src') || img.getAttribute('src');
      if (!/^(https?:|data:|\/)/.test(src)) img.setAttribute('src', resolve(page.src, src));
      img.removeAttribute('data-src');
    });
    // Consecutive quote cards sit in a grid.
    let run = [];
    const flush = () => { if (run.length > 1) { const g = document.createElement('div'); g.className = 'quote-grid'; run[0].before(g); run.forEach(c => g.appendChild(c)); } run = []; };
    [...tmp.children].forEach(el => { if (el.classList.contains('quote-card')) run.push(el); else flush(); });
    flush();

    const idx = PAGES.indexOf(page);
    const prev = PAGES[idx - 1], next = PAGES[idx + 1];
    const crumbs = [page.section, page.group].filter(Boolean).map(esc).join('<span aria-hidden="true">›</span>');

    els.content.innerHTML = `
      <div class="crumbs">${crumbs}</div>
      <h1 class="page-title">${title}</h1>
      ${lede ? `<p class="page-lede">${lede}</p>` : ''}
      <div class="page-meta"><span>${esc(page.src)}</span>${page.updated ? `<span>Updated ${esc(page.updated)}</span>` : ''}</div>
      <div class="prose">${tmp.innerHTML}</div>
      <nav class="pager" aria-label="Pages">
        ${prev ? `<a class="prev" href="#${prev.id}"><span class="dir">← Previous</span><span class="ttl">${esc(prev.title)}</span></a>` : ''}
        ${next ? `<a class="next" href="#${next.id}"><span class="dir">Next →</span><span class="ttl">${esc(next.title)}</span></a>` : ''}
      </nav>`;
    document.title = `${page.title} · High Street Docs`;
    buildToc();
    window.scrollTo(0, 0);
  }
  function buildToc() {
    const hs = [...els.content.querySelectorAll('.prose h2, .prose h3')];
    if (tocObserver) tocObserver.disconnect();
    if (hs.length < 2) { els.toc.innerHTML = ''; return; }
    els.toc.innerHTML = `<p class="toc-title">On this page</p><ul>${hs.map(h => `<li class="lvl-${h.tagName[1]}"><a href="#${currentId()}" data-target="${h.id}">${esc(h.textContent)}</a></li>`).join('')}</ul>`;
    els.toc.querySelectorAll('a').forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      document.getElementById(a.dataset.target)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }));
    tocObserver = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) els.toc.querySelectorAll('a').forEach(a => a.classList.toggle('is-active', a.dataset.target === en.target.id));
      });
    }, { rootMargin: '-80px 0px -70% 0px' });
    hs.forEach(h => tocObserver.observe(h));
  }

  // --- Mobile sheet -----------------------------------------------------------
  function openNav() { document.body.classList.add('nav-open'); els.scrim.hidden = false; els.menu.setAttribute('aria-expanded', 'true'); }
  function closeNav() { document.body.classList.remove('nav-open'); els.scrim.hidden = true; els.menu.setAttribute('aria-expanded', 'false'); }
  els.menu.addEventListener('click', () => document.body.classList.contains('nav-open') ? closeNav() : openNav());
  els.scrim.addEventListener('click', closeNav);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeNav();
    if (e.key === '/' && document.activeElement !== els.search) { e.preventDefault(); els.search.focus(); }
  });
  els.search.addEventListener('input', () => renderNav(els.search.value));

  fetch('site/nav.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(nav => {
      NAV = nav; PAGES = flatten(nav); BY_SRC = new Map(PAGES.map(p => [p.src, p]));
      renderNav();
      window.addEventListener('hashchange', render);
      render();
    })
    .catch(e => { els.content.innerHTML = `<p class="state">Couldn’t load the navigation (${esc(e.message)}).</p>`; });
})();
</script>
