<style>
/* Docs shell in the shadcn/ui idiom: neutral zinc tokens, hierarchy from weight and space, borders only where they separate. */
:root {
  --bg: #ffffff;
  --bg-subtle: #fafafa;
  --fg: #09090b;
  --fg-2: #3f3f46;
  --muted: #f4f4f5;
  --muted-fg: #71717a;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --primary: #18181b;
  --primary-fg: #fafafa;
  --ring: #a1a1aa;
  --link: #18181b;
  --quote-bar: #d4d4d8;
  --dg-edge: #8a8a92;
  --c1: #3866c9; --c2: #c07a1e; --c3: #2a8a64; --c4: #8556c2; --c5: #c8473a;
  --chosen: #1f6b4c;
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 8px;
  --header-h: 56px;
  --sidebar-w: 260px;
  --toc-w: 208px;
  --content-w: 800px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090b; --bg-subtle: #111113; --fg: #fafafa; --fg-2: #d4d4d8; --muted: #18181b; --muted-fg: #a1a1aa;
    --border: #27272a; --border-strong: #3f3f46; --primary: #fafafa; --primary-fg: #18181b; --ring: #52525b; --link: #fafafa; --quote-bar: #3f3f46; --dg-edge: #66666e;
    --c1: #7ea4ee; --c2: #e0a35a; --c3: #5cbf95; --c4: #b495e6; --c5: #e98272; --chosen: #5cbf95;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090b; --bg-subtle: #111113; --fg: #fafafa; --fg-2: #d4d4d8; --muted: #18181b; --muted-fg: #a1a1aa;
  --border: #27272a; --border-strong: #3f3f46; --primary: #fafafa; --primary-fg: #18181b; --ring: #52525b; --link: #fafafa; --quote-bar: #3f3f46; --dg-edge: #66666e;
  --c1: #7ea4ee; --c2: #e0a35a; --c3: #5cbf95; --c4: #b495e6; --c5: #e98272; --chosen: #5cbf95;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-sans); font-size: 15px; line-height: 1.65;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 4px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  height: var(--header-h); display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.brand-mark { width: 26px; height: 26px; border-radius: 50%; flex: none; display: block; }
.brand-name { font-weight: 600; font-size: 14px; white-space: nowrap; }
.brand-sub { color: var(--muted-fg); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sep { color: var(--border-strong); }
.topbar-spacer { flex: 1; }
.controls { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); }
.seg button { display: inline-grid; place-items: center; height: 26px; min-width: 26px; padding: 0 8px; border: 0; border-radius: 999px; background: transparent; color: var(--muted-fg); font: 500 12px var(--font-sans); letter-spacing: .02em; cursor: pointer; }
.seg button svg { width: 14px; height: 14px; }
.seg.icons button { padding: 0; width: 26px; }
.seg button:hover { color: var(--fg); }
.seg button[aria-checked="true"] { background: var(--muted); color: var(--fg); box-shadow: inset 0 0 0 1px var(--border); }
.lang-note { font-size: 13px; color: var(--muted-fg); border-left: 2px solid var(--border); padding: 2px 0 2px 12px; margin: 0 0 var(--s-5); }
.side-btn { display: grid; place-items: center; flex: none; width: 32px; height: 32px; margin-left: -6px; padding: 0; border: 0; border-radius: var(--radius); background: transparent; color: var(--muted-fg); cursor: pointer; }
.side-btn:hover { background: var(--muted); color: var(--fg); }
.side-btn svg { width: 16px; height: 16px; }
/* Collapsed sidebar (wide screens): the content takes the full width; the toggle stays in the top bar. */
@media (min-width: 861px) {
  body.nav-collapsed .shell { grid-template-columns: minmax(0, 1fr); }
  body.nav-collapsed .sidebar { display: none; }
}
.menu-btn {
  display: none; width: 36px; height: 36px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--fg); cursor: pointer; place-items: center; flex: none;
}

/* Shell: sidebar pinned to the left edge, "On this page" to the right edge, content centred between them (Vercel docs layout) */
.shell {
  display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
}
.sidebar {
  position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px));
  height: calc(100vh - var(--header-h) - env(safe-area-inset-top, 0px));
  overflow-y: auto; border-right: 1px solid var(--border);
  padding: 20px 12px 40px max(16px, env(safe-area-inset-left, 0px));
  background: var(--bg);
}
.search {
  width: 100%; height: 34px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--fg); font: inherit; font-size: 13px; padding: 0 10px; margin-bottom: 20px;
}
.search::placeholder { color: var(--muted-fg); }
.search:hover { border-color: var(--border-strong); }
.nav-group { display: flex; flex-direction: column; gap: 1px; margin-bottom: 24px; }
.nav-group-title {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; font-weight: 600; padding: 0 8px 6px; color: var(--fg);
}
.nav-group.is-disabled .nav-group-title { color: var(--muted-fg); font-weight: 500; }
/* The two blocks of the sidebar: the case first, then the AI context. A block title sits above its
   sections in the muted tone, and a rule separates the second block from the first. */
.nav-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; margin: 0 0 var(--s-4); border: 1px solid var(--border); border-radius: 10px; background: var(--muted); }
.nav-tab { appearance: none; border: 0; border-radius: 7px; padding: 6px 8px; background: transparent; color: var(--muted-fg); font: 500 12.5px/1.25 var(--font-sans); cursor: pointer; text-align: center; }
.nav-tab:hover { color: var(--fg); }
.nav-tab[aria-selected="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--border); }
.nav-tab:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.nav-area-sub { margin: 0 0 var(--s-3); padding: 0 8px; font-size: 12px; color: var(--muted-fg); }
.nav-area-title { padding: var(--s-2) 8px var(--s-2); font-size: 12px; font-weight: 600; color: var(--muted-fg); border-top: 1px solid var(--border); }
.nav-area-title:first-child { border-top: 0; padding-top: 0; }
.badge { font-size: 12px; font-weight: 400; color: var(--muted-fg); }
.nav-link {
  display: block; text-decoration: none; font-size: 13.5px; line-height: 1.4; color: var(--muted-fg);
  padding: 6px 8px; border-radius: 6px;
}
.nav-link:hover { color: var(--fg); }
.nav-link[aria-current="page"] { color: var(--fg); background: var(--muted); font-weight: 500; }
.nav-sub { display: flex; flex-direction: column; gap: 1px; margin: 0 0 4px 12px; padding-left: 6px; border-left: 1px solid var(--border); }
.nav-sub-title { font-size: 13.5px; color: var(--fg-2); padding: 6px 8px 2px; }
.nav-empty { font-size: 13px; color: var(--muted-fg); padding: 2px 8px; line-height: 1.45; }

/* Main */
.main {
  display: grid; grid-template-columns: minmax(0, 1fr) var(--toc-w); gap: 48px;
  padding: 40px max(32px, env(safe-area-inset-right, 0px)) 96px 48px; min-width: 0;
}
.content { min-width: 0; width: 100%; max-width: var(--content-w); margin: 0 auto; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted-fg); margin-bottom: 12px; }
.crumbs span[aria-hidden] { opacity: .6; }
.page-title { font-size: 34px; line-height: 1.15; letter-spacing: -.025em; font-weight: 600; margin: 0 0 12px; text-wrap: balance; }
.page-lede { font-size: 18px; line-height: 1.55; color: var(--muted-fg); margin: 0 0 16px; max-width: 62ch; text-wrap: pretty; }
.page-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted-fg); padding-bottom: 28px; border-bottom: 1px solid var(--border); margin-bottom: 32px; font-variant-numeric: tabular-nums; }
.page-meta code { font-family: var(--font-mono); font-size: 12px; }

/* Prose */
.prose > :first-child { margin-top: 0; }
.prose p, .prose li { max-width: 68ch; text-wrap: pretty; }
.prose h2 { font-size: 23px; line-height: 1.3; letter-spacing: -.015em; font-weight: 600; margin: 56px 0 14px; scroll-margin-top: 84px; text-wrap: balance; }
.prose h3 { font-size: 17px; line-height: 1.4; letter-spacing: -.005em; font-weight: 600; margin: 36px 0 10px; scroll-margin-top: 84px; text-wrap: balance; }
.prose h4 { font-size: 15px; font-weight: 600; margin: 24px 0 6px; }
.prose h2 + h3 { margin-top: 20px; }
.prose p { margin: 0 0 16px; }
.prose ul, .prose ol { padding-left: 20px; margin: 0 0 18px; }
.prose li { margin: 6px 0; padding-left: 2px; }
.prose li::marker { color: var(--muted-fg); }
.prose ol li::marker { font-variant-numeric: tabular-nums; }
.prose a { color: var(--link); text-decoration: underline; text-decoration-color: var(--border-strong); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.prose a:hover { text-decoration-color: currentColor; }
.prose a:not([href]) { text-decoration-style: dotted; cursor: help; }
.prose strong { font-weight: 600; }
.prose hr { border: 0; border-top: 1px solid var(--border); margin: 40px 0; }
.prose code { font-family: var(--font-mono); font-size: .85em; background: var(--muted); border-radius: 4px; padding: 1px 5px; }
.prose pre { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; overflow-x: auto; font-size: 13px; line-height: 1.6; }
.prose pre code { background: none; padding: 0; font-size: inherit; }
.prose blockquote { margin: 0 0 18px; padding: 0 0 0 16px; border-left: 2px solid var(--quote-bar); color: var(--fg-2); }
.prose img { max-width: 100%; height: auto; }

/* Tables: no outer box; a firm rule under the header, hairlines between rows. */
.table-wrap { overflow-x: auto; margin: 8px 0 28px; -webkit-overflow-scrolling: touch; }
.prose table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.5; }
.prose th { text-align: left; vertical-align: bottom; font-size: 13px; font-weight: 500; color: var(--muted-fg); padding: 0 16px 8px 0; border-bottom: 1px solid var(--border-strong); }
.prose td { padding: 11px 16px 11px 0; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.prose th:last-child, .prose td:last-child { padding-right: 0; }
.prose td:first-child { color: var(--fg); font-weight: 500; }
.prose td strong { color: var(--fg); }
.prose th.num, .prose td.num { text-align: right; white-space: nowrap; }
.prose td.num { font-weight: 400; }
.prose th.sym, .prose td.sym { text-align: center; width: 1%; white-space: nowrap; padding-left: 8px; padding-right: 8px; color: var(--fg); }
.prose table.is-wide th.num, .prose table.is-wide td.num { min-width: 0; width: 1%; }
/* Many columns: give each room and keep the row label in view while scrolling sideways. */
.prose table.is-wide { min-width: 880px; font-size: 13.5px; }
.prose table.is-wide th, .prose table.is-wide td { min-width: 8.5rem; }
.prose table.is-wide th:first-child, .prose table.is-wide td:first-child { position: sticky; left: 0; z-index: 1; background: var(--bg); min-width: 9.5rem; box-shadow: inset -1px 0 0 var(--border); padding-left: 0; }
.prose table.is-wide th:first-child + *, .prose table.is-wide td:first-child + * { padding-left: 14px; }
/* Two-column key/value tables written with an empty header row. */
.prose table.kv thead { display: none; }
.prose table.kv { border-top: 1px solid var(--border); }
.prose table.kv td:first-child { width: 11rem; font-weight: 500; color: var(--fg); font-size: 13.5px; }
.prose table.kv td { padding-top: 10px; padding-bottom: 10px; }

/* Evidence: quote cards */
.quote-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px 16px; margin: 0 0 12px; background: var(--bg); display: flex; flex-direction: column; }
.quote-card .quote-text { font-size: 15.5px; line-height: 1.55; margin: 0 0 14px; padding: 0; border: 0; color: var(--fg); text-indent: -.4em; text-wrap: pretty; }
.quote-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 12.5px; color: var(--muted-fg); font-variant-numeric: tabular-nums; margin-top: auto; }
.quote-meta .who { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 0 8px; margin-bottom: 2px; }
.quote-meta .handle { color: var(--fg); font-weight: 500; overflow-wrap: anywhere; }
.quote-meta a { color: var(--muted-fg); text-decoration: none; margin-left: auto; white-space: nowrap; }
.quote-meta a:hover { color: var(--fg); }
.status { display: inline-flex; align-items: center; gap: 5px; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-verified { color: var(--fg-2); }
.status-archive { color: var(--muted-fg); }
.status-archive::before { background: transparent; box-shadow: inset 0 0 0 1px currentColor; }
.quote-card .quote-context { font-size: 13px; line-height: 1.5; color: var(--muted-fg); margin: 6px 0 0; max-width: none; }
.tags { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.tag { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted-fg); }
.quote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; margin: 8px 0 24px; }
.quote-grid .quote-card { margin: 0; }

/* Empathy map (Strategyzer canvas order): six equal cells, hairline gutters. */
.vpc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-4); align-items: start; }
.vpc-side { display: grid; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; align-content: start; }
.vpc-title { margin: 0; padding: 10px 20px; background: var(--bg-subtle); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-fg); }
.vpc-cell { padding: 16px 20px; background: var(--bg); min-width: 0; }
.vpc-cell ul { margin: 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.55; color: var(--fg-2); }
.vpc-cell li { position: relative; margin: 0; padding: 0 0 0 14px; max-width: none; }
.vpc-cell li + li { margin-top: 8px; }
.vpc-cell li::before { content: ""; position: absolute; left: 0; top: .68em; width: 5px; height: 1px; background: var(--muted-fg); }
.empathy { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin: 12px 0 28px; }
.empathy-cell { padding: 18px 20px 16px; background: var(--bg); min-width: 0; }
.empathy-cell.pains, .empathy-cell.gains { background: var(--bg-subtle); }
.empathy-label { display: flex; align-items: center; gap: var(--s-2); font-size: 14px; font-weight: 600; color: var(--fg); margin: 0 0 8px; }
.empathy-label .ic { flex: none; width: 16px; height: 16px; color: var(--muted-fg); }
.empathy-cell.pains .ic { color: var(--c5); } .empathy-cell.gains .ic { color: var(--c3); }
.vpc-cell .empathy-label .ic { color: var(--tone); }
.empathy-cell ul { margin: 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.55; color: var(--fg-2); }
.empathy-cell li { position: relative; margin: 0; padding: 0 0 0 14px; max-width: none; }
.empathy-cell li + li { margin-top: 8px; }
.empathy-cell li::before { content: ""; position: absolute; left: 0; top: .68em; width: 5px; height: 1px; background: var(--muted-fg); }

/* Timeline */
.timeline { list-style: none; padding: 0; margin: 8px 0 28px; }
.timeline li { position: relative; display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 0 20px; padding: 0 0 16px; margin: 0; max-width: none; }
.timeline li::before { content: ""; position: absolute; left: calc(7.5rem + 9px); top: 0; bottom: 0; width: 1px; background: var(--border); }
.timeline li::after { content: ""; position: absolute; left: calc(7.5rem + 6px); top: .55em; width: 7px; height: 7px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--muted-fg); }
.timeline li:first-child::before { top: .8em; }
.timeline li:last-child::before { bottom: auto; height: .8em; }
.timeline li > :not(time) { grid-column: 2; }
.timeline time { grid-column: 1; text-align: right; font-size: 13px; color: var(--muted-fg); font-variant-numeric: tabular-nums; padding-top: 1px; white-space: nowrap; }
.timeline li { color: var(--fg-2); }
.timeline .tl-text { padding-left: 14px; }

/* Page summary: label column + bullets, ruled, no box. */
.summary { margin: 0 0 40px; border-bottom: 1px solid var(--border); }
.prose > .summary:first-child section:first-child { padding-top: 0; }
.summary section { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 4px 24px; padding: 16px 0; border-top: 1px solid var(--border); min-width: 0; }
.summary section:first-child { border-top: 0; }
.summary h5 { margin: 0; font-size: 13px; line-height: 1.6; font-weight: 600; color: var(--fg); padding-top: 1px; }
.summary ul { margin: 0; padding: 0; list-style: none; font-size: 14.5px; line-height: 1.6; color: var(--fg-2); }
.summary li { position: relative; margin: 0; padding-left: 16px; max-width: 70ch; }
.summary li + li { margin-top: 6px; }
.summary li::before { content: ""; position: absolute; left: 0; top: .78em; width: 6px; height: 1px; background: var(--muted-fg); }
.summary .takeaways ul { color: var(--fg); font-size: 15px; }
.summary .ai h5, .summary .tradeoffs h5 { color: var(--muted-fg); font-weight: 500; }
@media (max-width: 640px) { .summary section { grid-template-columns: minmax(0, 1fr); } }

/* Persona header: portrait, tagline, attributes in columns. */
.persona { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 0 24px; align-items: start; margin: 12px 0 24px; }
@font-face { font-family: 'Switzer'; src: url('private/fonts/switzer-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Switzer'; src: url('private/fonts/switzer-500.woff2') format('woff2'); font-weight: 500; font-display: swap; }
@font-face { font-family: 'Switzer'; src: url('private/fonts/switzer-600.woff2') format('woff2'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Gambetta'; src: url('private/fonts/gambetta-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
.marks { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--s-5); margin: var(--s-4) 0 var(--s-6); }
.marks figure { margin: 0; display: grid; gap: var(--s-2); justify-items: start; }
.marks img { display: block; max-width: 100%; height: auto; }
.marks figcaption { max-width: 24ch; font-size: 13px; line-height: 1.4; color: var(--muted-fg); }
.marks.wide figcaption { max-width: 70ch; }
.marks.wide img { border-radius: 14px; }
.intro-video { display: block; width: 100%; max-width: 320px; height: auto; aspect-ratio: 1; margin: var(--s-4) 0 var(--s-6); border-radius: 14px; background: #3d35b8; }
/* Phone clips and stills on the case pages. They are cropped to the device frame; the corners are rounded here so no page shows around them. */
.phone-video, .phone-shot { display: block; width: 100%; max-width: 240px; height: auto; aspect-ratio: 450 / 948; border-radius: 18.6% / 8.8%; background: #0b0b0c; }
.phone-video.android, .phone-shot.android { aspect-ratio: 450 / 976; border-radius: 16% / 7.4%; }
.feature { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: var(--s-5); align-items: start; margin: var(--s-3) 0 var(--s-6); }
.feature > div > :first-child { margin-top: 0; }
.feature .case-shot { margin: 0; }
@media (max-width: 640px) { .feature { grid-template-columns: minmax(0, 1fr); gap: var(--s-3); } }
/* The start of the Overview: the Loom walkthrough beside the home screen as iOS renders it. */
.overview-hero { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: var(--s-6); align-items: start; margin: var(--s-5) 0 var(--s-7); }
.hero-side { display: flex; flex-direction: column; gap: var(--s-5); min-width: 0; }
.prose .hero-side .dg-brief { margin: 0; }
.overview-hero figure { margin: 0; }
.overview-hero figcaption { margin-top: var(--s-2); font-size: 13px; line-height: 1.4; color: var(--muted-fg); }
/* The walkthrough opens on Loom: the artifact's page can't frame other sites, so this is a link drawn as a player. */
.prose a.loom-card { position: relative; display: flex; align-items: flex-end; aspect-ratio: 16 / 9; padding: var(--s-4); border-radius: 14px; overflow: hidden; background: #18181b; color: #fafafa; text-decoration: none; box-shadow: 0 0 0 1px var(--border); }
/* The poster is a still from the recording; a dark fade at the bottom keeps the title legible over it. */
.prose .loom-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.loom-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(9,9,11,.82) 0%, rgba(9,9,11,.35) 45%, rgba(9,9,11,.05) 100%); }
.loom-text, .loom-play { z-index: 1; }
.loom-card:hover .loom-play { transform: translate(-50%, -50%) scale(1.06); }
.loom-play { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; border-radius: 50%; background: #fafafa; box-shadow: 0 6px 24px rgba(0,0,0,.35); transform: translate(-50%, -50%); transition: transform .15s; }
.loom-play::after { content: ""; position: absolute; left: 26px; top: 21px; border-left: 18px solid #18181b; border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
.loom-text { position: relative; display: flex; flex-direction: column; gap: 2px; }
.loom-text b { font-size: 15px; font-weight: 600; }
.loom-text small { font-size: 13px; color: #a1a1aa; }
@media (prefers-reduced-motion: reduce) { .loom-play { transition: none; } }
.hero-phone img { display: block; width: 100%; height: auto; }
@media (max-width: 760px) { .overview-hero { grid-template-columns: minmax(0, 1fr); gap: var(--s-5); } .hero-phone { max-width: 320px; } }
.phones { display: flex; gap: var(--s-4); margin: var(--s-4) 0 var(--s-6); }
.phones .phone-shot { flex: 1 1 0; min-width: 0; max-width: 220px; }
.case-shot { display: block; max-width: 100%; height: auto; border-radius: 12px; box-shadow: 0 0 0 1px var(--border); margin: var(--s-4) 0 var(--s-6); }
/* The prose column is a size container, so the case diagrams below reflow on its width, sidebar or not. */
.page-title ~ .prose { container: prose / inline-size; }
/* Case diagrams. Built in HTML so labels stay text, follow the theme and reflow on a phone. Text sits only on --bg or
   --bg-subtle in --fg, --fg-2 or --muted-fg, the pairs the site already passes at 4.5:1. A dashed edge means a dead end
   or something only designed; a solid edge, something the prototype does. */
.dg { margin: var(--s-4) 0 var(--s-6); font-size: 14px; line-height: 1.45; color: var(--fg-2); }
.dg b { display: block; margin-bottom: 2px; color: var(--fg); font-weight: 600; }
.dg small { display: block; font-size: 12.5px; color: var(--muted-fg); }
.dg-box { padding: var(--s-3); border: 1px solid var(--border-strong); border-radius: 10px; background: var(--bg-subtle); min-width: 0; }
.dg-box.is-dashed { border: 1.5px dashed var(--dg-edge); background: var(--bg); }
.dg-box.is-dashed small { margin-bottom: var(--s-1); }
.dg-list .dg-tag { white-space: normal; border-radius: 6px; }
.dg-tag { display: inline-block; padding: 0 7px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--bg); font-size: 12px; font-weight: 500; color: var(--fg); white-space: nowrap; }
/* Numbered steps that wrap into rows. */
.dg-steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--s-3); counter-reset: dgstep; }
.dg-steps .dg-box { counter-increment: dgstep; }
.dg-steps .dg-box::before { content: counter(dgstep); display: block; margin-bottom: var(--s-1); font: 600 12px var(--font-mono); color: var(--muted-fg); }
/* A process: numbered nodes on one line with arrows between them; the line turns vertical when the column is narrow.
   The last node, filled, is where the process lands. */
.dg-process { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--s-3); counter-reset: dgp; }
.dg-process li { position: relative; counter-increment: dgp; padding-top: 36px; min-width: 0; }
.dg-process li::before { content: counter(dgp); position: absolute; top: 0; left: 0; z-index: 1; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--fg-2); font: 600 12px var(--font-mono); color: var(--fg); }
.dg-process li::after { content: ""; position: absolute; top: 8px; left: 32px; right: calc(-1 * var(--s-3) + 6px); height: 10px; background: var(--dg-edge);
  clip-path: polygon(0 4px, calc(100% - 7px) 4px, calc(100% - 7px) 0, 100% 5px, calc(100% - 7px) 10px, calc(100% - 7px) 6px, 0 6px); }
.dg-process li:last-child::after { display: none; }
.dg-process li.is-end::before { background: var(--fg); color: var(--bg); box-shadow: none; }
.dg-process small { margin-top: 2px; text-wrap: pretty; }
@container prose (max-width: 760px) {
  .dg-process { grid-auto-flow: row; gap: 0; }
  .dg-process li { padding: 3px 0 var(--s-4) 40px; min-height: 64px; }
  .dg-process li:last-child { padding-bottom: 0; }
  .dg-process li::after { top: 32px; bottom: 4px; left: 8px; right: auto; width: 10px; height: auto;
    clip-path: polygon(4px 0, 6px 0, 6px calc(100% - 7px), 10px calc(100% - 7px), 5px 100%, 0 calc(100% - 7px), 4px calc(100% - 7px)); }
}
/* Figures with their source: the number, what it means, where it comes from. */
.prose :is(.dg-process, .dg-facts, .dg-stats, .dg-themes) { list-style: none; padding: 0; }
.prose.prose > p + :is(.dg-process, .dg-facts, .dg-stats, .dg-themes), .prose.prose > :is(.dg-process, .dg-facts, .dg-stats, .dg-themes) + p { margin-top: var(--s-5); }
.prose :is(.dg-process, .dg-facts, .dg-stats, .dg-themes) > li { margin: 0; max-width: none; }
.dg-facts li { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: var(--s-4); align-items: baseline; padding: var(--s-3) 0; border-top: 1px solid var(--border); }
.dg-facts li:last-child { border-bottom: 1px solid var(--border); }
.dg-facts b, .dg-stats b { margin: 0; font-size: 20px; line-height: 1.2; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dg-facts span { color: var(--fg-2); }
.dg-facts small { margin-top: 2px; }
.dg-facts small a, .dg-themes small a { color: var(--muted-fg); text-underline-offset: 2px; }
.dg-facts small a:hover, .dg-themes small a:hover { color: var(--fg); }
.dg-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 120px), 1fr)); gap: var(--s-4); }
.dg-stats li { padding-top: var(--s-2); border-top: 1.5px solid var(--fg-2); }
.dg-stats span { display: block; margin-top: 2px; font-size: 13px; line-height: 1.35; color: var(--muted-fg); }
@container prose (max-width: 520px) {
  .dg-facts li { grid-template-columns: 5.6rem minmax(0, 1fr); gap: var(--s-3); }
  .dg-facts b { font-size: 16px; }
  .dg-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* Themes: name, the one quote that carries it, and its source. */
.dg-themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: var(--s-3); counter-reset: dgt; }
.dg-themes li { counter-increment: dgt; display: flex; flex-direction: column; gap: var(--s-2); padding: var(--s-3) var(--s-4); border: 1px solid var(--border-strong); border-radius: 10px; background: var(--bg-subtle); }
.dg-themes b { margin: 0; }
.dg-themes b::before { content: counter(dgt); display: inline-block; min-width: 2.2em; font: 600 12px var(--font-mono); color: var(--muted-fg); }
.dg-themes q { color: var(--fg); font-size: 14.5px; line-height: 1.5; text-wrap: pretty; quotes: "“" "”"; }
.dg-themes small { margin-top: auto; overflow-wrap: anywhere; }
/* The proto-persona map, simplified: each cluster as one circle sized by its posts, on the two dimensions. */
.dg-pmap { margin-left: 0; margin-right: 0; }
.dg-pm-plot { position: relative; aspect-ratio: 2 / 1; border-left: 1.5px solid var(--dg-edge); border-bottom: 1.5px solid var(--dg-edge); }
.dg-pm-tick { position: absolute; left: var(--s-2); transform: translateY(-100%); padding-bottom: 2px; font-size: 12px; color: var(--muted-fg); white-space: nowrap; }
.dg-pm-y { display: block; margin-bottom: var(--s-2); font-size: 12px; font-weight: 500; color: var(--fg-2); }
.dg-pm-tick i { font-style: normal; margin-left: var(--s-2); color: var(--fg-2); font-weight: 500; }
.dg-pm-plot::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(var(--border), var(--border)) 0 12% / 100% 1px no-repeat, linear-gradient(var(--border), var(--border)) 0 37.3% / 100% 1px no-repeat,
    linear-gradient(var(--border), var(--border)) 0 62.7% / 100% 1px no-repeat, linear-gradient(var(--border), var(--border)) 0 88% / 100% 1px no-repeat; }
.dg-pm-tick.is-1 { top: 12%; } .dg-pm-tick.is-2 { top: 37.3%; } .dg-pm-tick.is-3 { top: 62.7%; } .dg-pm-tick.is-4 { top: 88%; }
.dg-pm-c { --c: var(--c1); position: absolute; display: grid; place-content: center; justify-items: center; width: calc(var(--k) * clamp(110px, 18%, 150px)); aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%);
  background: color-mix(in srgb, var(--c) 18%, var(--bg)); box-shadow: inset 0 0 0 2px var(--c); color: var(--fg-2); font-size: 13px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.dg-pm-c b { margin: 0; font-size: 14px; }
.dg-pm-c.is-sam { --c: var(--c1); --k: 1; left: min(85%, calc(100% - 58px)); top: 21%; box-shadow: inset 0 0 0 2.5px var(--c); background: color-mix(in srgb, var(--c) 28%, var(--bg)); }
.dg-pm-c.is-jess { --c: var(--c2); --k: .74; left: 54%; top: 84%; }
.dg-pm-c.is-ruth { --c: var(--c3); --k: .52; left: 41.6%; top: 28.7%; }
.dg-pm-x { display: flex; justify-content: space-between; gap: var(--s-2); margin-top: var(--s-2); font-size: 12px; color: var(--muted-fg); }
.dg-pm-x span:nth-child(2) { color: var(--fg-2); font-weight: 500; }
@container prose (max-width: 520px) {
  .dg-pm-plot { aspect-ratio: 4 / 3.4; }
}
/* A chain of boxes with labelled arrows; it turns vertical when the column is narrow. */
.dg-chain { display: flex; align-items: stretch; gap: var(--s-1); }
.dg-chain > .dg-box { flex: 1 1 0; }
.dg-arrow { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 72px; min-width: 0; font-size: 12px; text-wrap: balance; color: var(--muted-fg); text-align: center; }
.dg-arrow::after { content: "→"; font-size: 18px; line-height: 1; color: var(--fg-2); }
.dg-arrow.is-both::after { content: "⇄"; }
.dg-arrow span { white-space: nowrap; }
.dg-hub > .dg-box:nth-child(3) { flex: 1.2 1 0; border-color: var(--fg-2); }
.dg-cap { margin: var(--s-4) 0 var(--s-2); font-size: 12px; color: var(--muted-fg); }
.dg-list { display: grid; gap: var(--s-1); margin-top: var(--s-1); }
.dg-hub .dg-list > span { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); }
@container prose (max-width: 700px) {
  .dg-chain { flex-direction: column; }
  .dg-arrow { flex-direction: row; width: auto; min-width: 0; padding: 0 var(--s-3); justify-content: flex-start; gap: var(--s-2); }
  .dg-arrow::after { content: "↓"; order: -1; }
  .dg-arrow.is-both::after { content: "⇅"; }
}
/* The journey: time, step, and the dead ends that branch off it. */
.dg-journey { display: grid; }
.dg-jrow { position: relative; display: grid; grid-template-columns: 3.25rem minmax(0, 1fr) minmax(0, 1fr); column-gap: var(--s-4); padding-bottom: var(--s-4); }
.dg-jrow::before { content: ""; position: absolute; left: calc(3.25rem + var(--s-4) + 4px); top: 0; bottom: 0; width: 1px; background: var(--border-strong); }
.dg-jrow:first-child::before { top: .6em; }
.dg-jrow:last-child { padding-bottom: 0; }
.dg-jrow:last-child::before { bottom: auto; height: .6em; }
.dg-jrow.is-head { padding-bottom: var(--s-2); font-size: 12px; color: var(--muted-fg); }
.dg-jrow.is-head::before { display: none; }
.dg-jrow.is-head > :nth-child(2) { padding-left: 22px; }
.dg-jrow time { font: 500 12.5px/1.6 var(--font-mono); color: var(--muted-fg); text-align: right; }
.dg-jstep { position: relative; padding-left: 22px; }
.dg-jrow:not(.is-head) .dg-jstep::before { content: ""; position: absolute; left: 0; top: .35em; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 2px var(--fg); }
.dg-jends { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s-1); }
.dg-jend { padding: 2px 9px; border: 1px dashed var(--dg-edge); border-radius: 8px; font-size: 13px; color: var(--fg-2); }
.dg-jend::before { content: "↳ "; color: var(--muted-fg); }
@container prose (max-width: 560px) {
  .dg-jrow { grid-template-columns: 2.75rem minmax(0, 1fr); column-gap: var(--s-3); }
  .dg-jrow::before { left: calc(2.75rem + var(--s-3) + 4px); }
  .dg-jrow.is-head > :last-child { display: none; }
  .dg-jends { grid-column: 2; padding: var(--s-2) 0 0 22px; }
  .dg-jends:empty { display: none; }
}
/* Two conversations side by side. */
.dg-convos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--s-4); }
.dg-convo { display: flex; flex-direction: column; gap: var(--s-2); padding: var(--s-3); border: 1px solid var(--border-strong); border-radius: 12px; }
.dg-convo > b { margin-bottom: var(--s-1); font-size: 13px; }
.dg-msg { max-width: 92%; padding: 6px 11px; border-radius: 12px; font-size: 13.5px; line-height: 1.4; color: var(--fg); background: var(--bg-subtle); box-shadow: inset 0 0 0 1px var(--border-strong); }
.dg-msg.is-me { align-self: flex-end; background: var(--fg); color: var(--bg); box-shadow: none; }
.dg-msg.is-shop { align-self: flex-end; }
.dg-msg.is-card { max-width: 100%; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px var(--s-2); border-radius: 8px; }
.dg-msg.is-sys { max-width: 100%; align-self: stretch; padding: 0 2px; background: none; box-shadow: none; font-size: 12.5px; color: var(--muted-fg); text-align: center; }
:root[data-theme="dark"] .dg-msg.is-me { background: var(--fg-2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dg-msg.is-me { background: var(--fg-2); } }
/* Two plain lists side by side. */
.dg-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--s-4); }
.dg-cols:has(> .dg-box:nth-child(4):last-child) { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.dg-cols ul { margin: var(--s-2) 0 0; padding-left: 18px; }
.dg-cols li { margin: var(--s-1) 0; }
/* Options side by side; the chosen one has the canvases' green outline and a badge (--chosen: 6.4:1 under white text in light, 8.8:1 under the dark ground in dark). */
.dg-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-4); }
.dg-options.dg-options-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@container prose (max-width: 480px) { .dg-options { grid-template-columns: minmax(0, 1fr); } }
.dg-options .dg-box { display: flex; flex-direction: column; gap: var(--s-2); background: var(--bg); }
.dg-options .dg-box b { margin: 0; }
.dg-options .dg-box > span:not(.dg-badge) { color: var(--muted-fg); }
.dg-options .dg-box.is-chosen > span:not(.dg-badge) { color: var(--fg-2); }
.dg-options .dg-badge:not(.is-chosen) { border-style: solid; border-color: var(--border-strong); }
.dg-options .dg-box.is-chosen { border-color: var(--chosen); box-shadow: 0 0 0 1.5px var(--chosen); background: color-mix(in srgb, var(--chosen) 6%, var(--bg)); }
.dg-badge { align-self: flex-start; padding: 1px var(--s-2); border: 1px dashed var(--dg-edge); border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--fg-2); }
.dg-badge.is-chosen { border: 0; background: var(--chosen); color: var(--bg); font-weight: 600; }
/* A bar chart drawn in HTML: names, bars on one scale, values at the bar ends, and a dashed reference line over the bars. */
.dg-bars { margin-left: 0; margin-right: 0; padding: var(--s-4); border: 1px solid var(--border-strong); border-radius: 12px; }
.dg-bars-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--s-2); margin-bottom: var(--s-4); }
.dg-bars-head b { margin: 0; }
.dg-bars-plot { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--s-3) var(--s-3); align-items: center; padding-bottom: var(--s-5); }
.dg-bar-name { font-size: 13px; color: var(--fg-2); }
.dg-bar-track { grid-column: 2; display: flex; align-items: center; gap: var(--s-4); height: 24px; padding-right: 5.5em; font-size: 13px; }
.dg-bar-track i { display: block; height: 100%; min-width: 2px; flex: none; border-radius: 0 6px 6px 0; background: color-mix(in srgb, var(--c1) 75%, var(--bg)); }
.dg-bar-track.is-strong i { background: var(--c1); }
.dg-bar-track em { margin-right: -5.5em; font-style: normal; font-weight: 600; font-size: 13px; color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; }
.dg-bars-scale { grid-column: 2; position: relative; align-self: stretch; margin-right: calc(5.5 * 13px); pointer-events: none; }
.dg-bars-line { position: absolute; top: calc(-1 * var(--s-2)); bottom: calc(-1 * var(--s-5)); border-left: 1.5px dashed var(--c5); }
.dg-bars-line span { position: absolute; bottom: 0; right: var(--s-2); font-size: 12px; font-weight: 600; color: var(--c5); white-space: nowrap; }
.dg-bars figcaption { margin-top: var(--s-2); font-size: 12.5px; color: var(--muted-fg); }
@container prose (max-width: 480px) { .dg-bars { padding: var(--s-3); } .dg-bars-plot { grid-template-columns: minmax(0, 5.5rem) minmax(0, 1fr); } .dg-bar-name { font-size: 12px; line-height: 1.3; } }
/* A hypothesis card: its number and status, then belief, test and pass mark as label and text. */
.dg-hyp { padding: var(--s-4); border: 1px solid var(--border-strong); border-radius: 12px; }
.dg-hyps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-4); align-items: stretch; }
.dg-hyps .dg-hyp dl { grid-template-columns: minmax(0, 1fr); gap: 0; }
.dg-hyps .dg-hyp dd + dt { margin-top: var(--s-3); }
@container prose (max-width: 720px) { .dg-hyps { grid-template-columns: minmax(0, 1fr); } }
.dg-hyp-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); margin-bottom: var(--s-3); }
.dg-hyp-head b { margin: 0; font-size: 14px; }
.dg-hyp dl { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: var(--s-2) var(--s-4); margin: 0; }
.dg-hyp dt { font-size: 12.5px; color: var(--muted-fg); padding-top: 1px; }
.dg-hyp dd { margin: 0; color: var(--fg); }
@container prose (max-width: 480px) { .dg-hyp dl { grid-template-columns: minmax(0, 1fr); gap: 0; } .dg-hyp dd + dt { margin-top: var(--s-3); } }
/* The overview: what each line is, then the line. */
.prose .dg-brief { list-style: none; padding: 0; }
.prose .dg-brief > li { max-width: none; margin: 0; display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: var(--s-3); align-items: baseline; padding: var(--s-2) 0; border-top: 1px solid var(--border); }
.dg-brief li:last-child { border-bottom: 1px solid var(--border); }
.dg-brief b { margin: 0; font-size: 12.5px; font-weight: 500; color: var(--muted-fg); }
.dg-brief span { color: var(--fg); }
@container prose (max-width: 480px) { .prose .dg-brief > li { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: var(--s-3); margin: var(--s-3) 0 var(--s-5); }

    const W = 680, H = 452, Lm = 128, R = 24, T = 36, B = 52;
    const sx = v => Lm + (v / 10.5) * (W - Lm - R), sy = v => T + (1 - (v + 0.8) / 11.6) * (H - T - B);

    d.points.forEach(p => (groups[`${p.x},${p.y}`] = groups[`${p.x},${p.y}`] || []).push(p));
    const placed = [];
    Object.values(groups).forEach(list => list.forEach((p, i) => {
      const per = Math.ceil(Math.sqrt(list.length)), r = Math.floor(i / per), c = i % per;
      const off = 13, w = (Math.min(per, list.length) - 1) * off, h = (Math.ceil(list.length / per) - 1) * off;
      placed.push({ ...p, cx: sx(p.x) - w / 2 + c * off, cy: sy(p.y) - h / 2 + r * off });
    }));
    let g = '';
    d.x.ticks.forEach(([v, lab]) => g += `<line class="gl" x1="${sx(v)}" x2="${sx(v)}" y1="${sy(10.8)}" y2="${sy(-0.8)}"/><text class="tk" x="${sx(v)}" y="${sy(-0.8) + 18}" text-anchor="middle">${esc(tr(lab))}</text>`);
    d.y.ticks.forEach(([v, lab]) => g += `<line class="gl" x1="${sx(0)}" x2="${sx(10.5)}" y1="${sy(v)}" y2="${sy(v)}"/><text class="tk" x="${Lm - 10}" y="${sy(v) + 4}" text-anchor="end">${esc(tr(lab))}</text>`);
    g += `<line class="base" x1="${sx(0)}" x2="${sx(10.5)}" y1="${sy(-0.8)}" y2="${sy(-0.8)}"/><line class="base" x1="${sx(0)}" x2="${sx(0)}" y1="${sy(10.8)}" y2="${sy(-0.8)}"/>`;
    g += `<text class="ax" x="${sx(0)}" y="${H - 6}">← ${esc(tr(d.x.min))}</text><text class="ax" x="${sx(10.5)}" y="${H - 6}" text-anchor="end">${esc(tr(d.x.max))} →</text>`;
    g += `<text class="ax" x="8" y="${T - 14}">↑ ${esc(tr(d.y.max))}</text><text class="ax" x="8" y="${sy(-0.8) + 18}">↓ ${esc(tr(d.y.min))}</text>`;

    });

      const mine = placed.filter(p => p.c === c); if (!mine.length) return;

    return `<figure class="cmap"><div class="cmap-scroll"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Posts by need and by where the occasion broke, grouped into clusters">${g}</svg></div>

  }

  // ```occasion-grid  JSON from scripts/build_personas.py: jobs x where the occasion broke, one mark per post.

  async function load(src) {

  // Decision log: each "NNN · Title" section becomes a timeline item, grouped by day. The Markdown stays the source.
  function decisionTimeline(tmp) {

    if (start < 0) return;
    const wrap = document.createElement('div'); wrap.className = 'dl';
    kids[start].before(wrap);
    let day = null, lastDate = '', i = start;
    while (i < kids.length) {
      const h = kids[i], m = /^(\d{3}) · (.*)$/.exec(h.textContent.trim());
      if (h.tagName !== 'H2' || !m) break;
      const body = [];
      i++;
      while (i < kids.length && kids[i].tagName !== 'H2') body.push(kids[i++]);
      let date = '', status = '', note = '';
      const first = body[0], strong = first && first.firstElementChild;
      const dm = strong && strong.tagName === 'STRONG' && /^(\d{4}-\d{2}-\d{2}) · (.+)$/.exec(strong.textContent.trim());
      if (dm) {

      const item = document.createElement('article'); item.className = `dl-item is-${kind}`;

      els.content.querySelector('.embed-about-btn').addEventListener('click', () => { box.hidden = !box.hidden; });
      foldableTitle('embed');
      return;
    }
    if (page.viewer) {
      // A viewer page shows the 3D illustrations (site/viewer3d.js); the Markdown summary opens from About.
      els.content.innerHTML = `<div class="cv-page" data-lang="${LANG}"><div class="cv-board"></div>
        <div class="cv-title"><div><div class="crumbs">${crumbs}</div><h1>${title}</h1></div><button type="button" class="cv-about">${esc(t('viewerAbout'))}</button></div></div>`;
      els.toc.innerHTML = '';
      document.title = `${L(page)} · Snuffle Docs`;
      foldableTitle('viewer');
      const board = els.content.querySelector('.cv-board');
      if (!window.HSViewer3D) { board.innerHTML = `<p class="state">${esc(t('viewerFail'))}</p>`; return; }
      const v = window.HSViewer3D.mount(board, { lang: LANG, t, icon, modelsUrl: page.viewer, about: `<div class="prose">${lede ? `<p>${lede}</p>` : ''}${tmp.innerHTML}</div>` });
      els.content.querySelector('.cv-about').addEventListener('click', () => v.showAbout());
      return;
    }
    if (page.canvas) {
      // A canvas page can carry versions, newest first; the newest opens and earlier ones stay one click away.
      const versions = Array.isArray(page.canvas) ? page.canvas : [{ file: page.canvas }];
      const picker = versions.length > 1 ? `<select class="cv-ver" aria-label="${esc(t('version'))}">${versions.map((v, i) => `<option value="${i}">${esc(v.version)}${i === 0 ? ` · ${esc(t('current'))}` : ''}</option>`).join('')}</select>` : '';
      // Flow shows the whole board; Proto (canvases with links between screens) clicks through one screen at a time.
      // The mode is remembered per page; #page?proto=<frame-id> opens Proto at that screen.
      const modeSeg = `<div class="seg cv-mode" role="radiogroup" aria-label="${esc(t('cvMode'))}" hidden>${['flow', 'proto'].map(m => `<button type="button" role="radio" data-cvmode="${m}" aria-checked="false" title="${esc(t(m === 'flow' ? 'modeFlowTip' : 'modeProtoTip'))}">${esc(t(m === 'flow' ? 'modeFlow' : 'modeProto'))}</button>`).join('')}</div>`;
      els.content.innerHTML = `<div class="cv-page" data-lang="${LANG}"><div class="cv-board"></div>
        <div class="cv-title"><div><div class="crumbs">${crumbs}</div><h1>${title}</h1></div>${modeSeg}<button type="button" class="cv-mbtn" aria-pressed="false" title="${esc(t('measureTip'))}" hidden>${esc(t('measure'))}</button>${picker}<button type="button" class="cv-about">${esc(t('about'))}</button></div></div>`;
      els.toc.innerHTML = '';
      document.title = `${L(page)} · Snuffle Docs`;
      foldableTitle('canvas');
      let cv = null;
      const modeKey = `hs-cv-mode:${page.id}`, seg = els.content.querySelector('.cv-mode');
      let deep = new URLSearchParams(decodeURIComponent(location.hash.slice(1)).split('?')[1] || '').get('proto');
      const onChange = ({ mode, frame }) => {
        store.set(modeKey, mode);
        seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.cvmode === mode)));
        const h = `#${page.id}${mode === 'proto' && frame ? `?proto=${encodeURIComponent(frame)}` : ''}`;
        if (location.hash !== h) history.replaceState(null, '', h);
      };
      seg.addEventListener('click', e => { const b = e.target.closest('[data-cvmode]'); if (b && cv) cv.setMode(b.dataset.cvmode); });
      // The measurement layer (nav item "measure": a JSON file) is off by default and remembered per viewer; it follows the newest version only.
      const mKey = `hs-cv-measure:${page.id}`, mBtn = els.content.querySelector('.cv-mbtn');
      const onMeasure = on => { store.set(mKey, on ? '1' : '0'); mBtn.setAttribute('aria-pressed', String(on)); };
      mBtn.addEventListener('click', () => { if (cv && cv.hasMeasure) cv.setMeasure(!cv.measure); });
      const show = async i => {
        const board = els.content.querySelector('.cv-board');
        let html;
        try { html = await load(versions[i].file); }
        catch (e) { board.innerHTML = `<p class="state">${esc(t('canvasFail'))} ${esc(e.message)}</p>`; return; }
        const box = document.createElement('div'); box.innerHTML = html;
        box.querySelectorAll('img[src]').forEach(img => { const s = img.getAttribute('src'); if (!/^(https?:|data:|\/)/.test(s)) img.setAttribute('src', resolve(versions[i].file, s)); });
        const mode = deep ? 'proto' : (store.get(modeKey) === 'proto' ? 'proto' : 'flow');
        let measure = null;
        if (page.measure && i === 0) { try { measure = JSON.parse(await load(page.measure)); } catch (e) { console.warn('measurement layer not loaded', e); } }
        const measureOn = !!measure && store.get(mKey) === '1';
        cv = window.HSCanvas.mount(board, box.innerHTML, { lang: LANG, icon, t, mode, proto: page.proto === true, start: deep, onChange, measure, measureOn, onMeasure, about: `<div class="prose">${lede ? `<p>${lede}</p>` : ''}${tmp.innerHTML}</div>` });
        deep = null;
        seg.hidden = !cv.hasProto;
        mBtn.hidden = !cv.hasMeasure;
        mBtn.setAttribute('aria-pressed', String(cv.hasMeasure && measureOn));
        seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.cvmode === cv.mode)));
      };
      els.content.querySelector('.cv-about').addEventListener('click', () => cv && cv.showAbout());
      els.content.querySelector('.cv-ver')?.addEventListener('change', e => show(+e.target.value));
      await show(0);
      return;
    }
    els.content.innerHTML = `
      <div class="crumbs">${crumbs}</div>
      <h1 class="page-title">${title}</h1>
      ${lede ? `<p class="page-lede">${lede}</p>` : ''}
      <div class="page-meta"><code>${esc(src)}</code>${page.updated ? `<span>Updated ${esc(page.updated)}</span>` : ''}</div>
      ${fallback ? `<p class="lang-note">${t('notTranslated')}</p>` : ''}
      <div class="prose">${tmp.innerHTML}</div>
      <nav class="pager" aria-label="Pages">
        ${prev ? `<a class="prev" href="#${prev.id}"><span class="dir">${t('prev')}</span><span class="ttl">${esc(L(prev))}</span></a>` : ''}
        ${next ? `<a class="next" href="#${next.id}"><span class="dir">${t('next')}</span><span class="ttl">${esc(L(next))}</span></a>` : ''}
      </nav>`;
    document.title = `${L(page)} · Snuffle Docs`;
    buildToc();
    window.scrollTo(0, 0);
  }
  function buildToc() {
    const hs = [...els.content.querySelectorAll('.prose h2, .prose h3')];
    if (tocObserver) tocObserver.disconnect();
    if (hs.length < 2) { els.toc.innerHTML = ''; return; }
    els.toc.innerHTML = `<p class="toc-title">${t('onPage')}</p><ul>${hs.map(h => `<li class="lvl-${h.tagName[1]}"><a href="#${currentId()}" data-target="${h.id}">${esc(h.textContent)}</a></li>`).join('')}</ul>`;
    els.toc.querySelectorAll('a').forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      document.getElementById(a.dataset.target)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }));
    tocObserver = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) els.toc.querySelectorAll('a').forEach(a => a.classList.toggle('is-active', a.dataset.target === en.target.id));
      });
    }, { rootMargin: '-80px 0px -70% 0px' });
    hs.forEach(h => tocObserver.observe(h));
  }

  // --- Mobile sheet -----------------------------------------------------------
  function openNav() { document.body.classList.add('nav-open'); els.scrim.hidden = false; els.menu.setAttribute('aria-expanded', 'true'); }
  function closeNav() { document.body.classList.remove('nav-open'); els.scrim.hidden = true; els.menu.setAttribute('aria-expanded', 'false'); }
  els.menu.addEventListener('click', () => document.body.classList.contains('nav-open') ? closeNav() : openNav());
  // --- Collapsible sidebar on wide screens (toggle at the top left, ⌘\ or Ctrl+\), remembered per viewer ---
  const MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  let NAV_COLLAPSED = store.get('hs-nav') === 'collapsed';
  function applyNavCollapse() {
    document.body.classList.toggle('nav-collapsed', NAV_COLLAPSED);
    const label = t(NAV_COLLAPSED ? 'showNav' : 'hideNav');
    els.side.setAttribute('aria-expanded', String(!NAV_COLLAPSED));
    els.side.setAttribute('aria-label', label);
    els.side.title = `${label} (${MAC ? '⌘\\' : 'Ctrl+\\'})`;
  }
  function toggleNavCollapse() {
    const inside = els.sidebar.contains(document.activeElement);
    NAV_COLLAPSED = !NAV_COLLAPSED; store.set('hs-nav', NAV_COLLAPSED ? 'collapsed' : 'open'); applyNavCollapse();
    if (NAV_COLLAPSED && inside) els.side.focus(); // focus never stays on a hidden link
  }
  els.side.addEventListener('click', toggleNavCollapse);
  applyNavCollapse();
  els.scrim.addEventListener('click', closeNav);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeNav();
    if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && (e.code === 'Backslash' || e.key === '\\')) {
      e.preventDefault();
      if (matchMedia('(max-width: 860px)').matches) { document.body.classList.contains('nav-open') ? closeNav() : openNav(); }
      else toggleNavCollapse();
    }
    if (e.key === '/' && document.activeElement !== els.search) { e.preventDefault(); els.search.focus(); }
  });
  els.search.addEventListener('input', () => renderNav(els.search.value));
  document.querySelectorAll('#theme-seg button').forEach(b => b.addEventListener('click', () => { MODE = b.dataset.mode; store.set('hs-theme', MODE); applyMode(); }));
  document.querySelectorAll('#lang-seg button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.lang === LANG) return;
    LANG = b.dataset.lang; store.set('hs-lang', LANG); applyLangUI(); applyNavCollapse(); renderNav(els.search.value); render();
  }));
  applyLangUI();

  fetch('site/nav.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(nav => {
      NAV = nav; PAGES = flatten(nav); BY_SRC = new Map(PAGES.map(p => [p.src, p]));
      renderNav();
      window.addEventListener('hashchange', () => { if (!/^#present(-\d+)?$/.test(location.hash)) render(); });
      render();
    })
    .catch(e => { els.content.innerHTML = `<p class="state">Couldn’t load the navigation (${esc(e.message)}).</p>`; });
})();
</script>
